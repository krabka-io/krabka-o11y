[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # quick-xml denial-of-service advisories: a quadratic duplicate-attribute
    # check, and an unbounded namespace-declaration allocation. quick-xml 0.41
    # fixes both. The only copy in this graph is 0.39 under `object_store`,
    # which parses the XML that S3 and Azure return. That input comes from the
    # object-store endpoint the operator configured, not from a query, so no
    # client chooses the document. Drop these once `object_store` takes 0.41.
    # Do not extend this reasoning to a parser a query can reach.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # RSA "Marvin" timing side-channel. `picky` pulls `rsa` in, and `picky` is
    # a hard dependency of `sspi`, which `krabka-security` uses for the
    # Kerberos path. That path authenticates over AES keytab keys and does no
    # RSA private-key operation, so the network-observable timing leak does
    # not apply. The advisory has no fixed release.
    "RUSTSEC-2023-0071",
    # bincode 1.3.3 is unmaintained. The team stopped development and calls
    # 2.0.1 feature-complete, so no safe upgrade exists. This is an
    # unmaintained notice, not a vulnerability. It reaches the graph through
    # `lrpar` and `lrlex`, the parser generator behind `promql-parser`.
    "RUSTSEC-2025-0141",
    # paste is unmaintained. It reaches the graph twice: through `pprof_util`
    # under `jemalloc_pprof`, which `krabka-telemetry` uses, and through
    # `refined_type`, which `krabka-blockstore` uses. Neither upstream offers
    # a release that drops it.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
    # webpki-root-certs ships the Mozilla NSS CA bundle, which is data rather
    # than code, under CDLA-Permissive-2.0. It arrives transitively under
    # rustls.
    "CDLA-Permissive-2.0",
]
exceptions = [
    # portpicker is public-domain-equivalent: The Unlicense, which is
    # OSI-approved and FSF Free/Libre. It enters through the `network_client`
    # feature of `sspi`, the Kerberos stack `krabka-security` uses for KDC
    # communication. Keep the allowance scoped to that crate.
    { allow = ["Unlicense"], crate = "portpicker" },
    # xxhash-rust is BSL-1.0, the Boost license, which is OSI-approved, FSF
    # Free/Libre and non-copyleft. `krabka-blockstore` and `krabka-promql`
    # both depend on it directly.
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
    # Creusot's specification attributes and proc macros are
    # LGPL-2.1-or-later. They enter the graph only through `krabka-throttle`,
    # whose arithmetic contracts they annotate, and an ordinary cargo build
    # uses Creusot's dummy macro implementation. Keep this allowance scoped to
    # the two crates rather than allowing LGPL over the whole graph.
    { allow = ["LGPL-2.1-or-later"], crate = "creusot-std" },
    { allow = ["LGPL-2.1-or-later"], crate = "creusot-std-proc" },
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Temporary DataFusion pin for profile query support.
    "https://github.com/apache/datafusion",
    # The sibling repositories. `[patch.crates-io]` in Cargo.toml pins every
    # crate each one publishes to a single revision, and sync-siblings.yml
    # proposes the bumps. krabka-schema-registry is on the list because the
    # broker depends on `krabka-schema-serde`, which that repository owns.
    "https://github.com/krabka-io/krabka-broker",
    "https://github.com/krabka-io/krabka-client-rs",
    "https://github.com/krabka-io/krabka-protocol",
    "https://github.com/krabka-io/krabka-schema-registry",
]
