name: mutation ratchet

on:
  pull_request:
    paths:
      - .aspect/mutants.axl
      - .github/workflows/mutants-ratchet.yml
      - tools/mutants-ratchet.py
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to sweep
        required: true
        type: choice
        options:
          - blockstore
          - metrics
          - observability
          - profiles
          - promql
          - traces
          - verified
      parts:
        description: Number of bounded remote jobs
        required: true
        type: choice
        options:
          - "2"
          - "4"
          - "8"
          - "16"
          - "24"
          - "32"
          - "48"
        default: "8"
      record:
        description: Print a replacement baseline instead of applying the ratchet
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutation-ratchet-${{ github.ref }}-${{ inputs.crate || 'verified' }}
  cancel-in-progress: false

env:
  MUTANTS_CRATE: ${{ inputs.crate || 'verified' }}
  MUTANTS_PARTS: ${{ inputs.parts || '2' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.parts.outputs.value }}
    steps:
      - id: parts
        env:
          CRATE: ${{ env.MUTANTS_CRATE }}
          PARTS: ${{ env.MUTANTS_PARTS }}
        run: |
          case "${CRATE}" in
            observability) maximum=48 ;;
            blockstore|metrics) maximum=24 ;;
            verified) maximum=8 ;;
            *) maximum=16 ;;
          esac
          count=$((PARTS < maximum ? PARTS : maximum))
          echo "value=$(jq -cn --argjson count "${count}" '[range(0; $count)]')" >>"${GITHUB_OUTPUT}"

  sweep:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: run bounded mutation part remotely
        id: remote
        env:
          CRATE: ${{ env.MUTANTS_CRATE }}
          PART: ${{ matrix.part }}
          PARTS: ${{ env.MUTANTS_PARTS }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/buildbuddy-${CRATE}-part-${PART}.log"
          script="$(cat <<'REMOTE_SCRIPT'
              set -euo pipefail
              curl -fsSLo /usr/local/bin/aspect https://github.com/aspect-build/aspect-cli/releases/download/v2026.31.17/aspect-cli-x86_64-unknown-linux-musl
              echo "1635a492bed80fb6e9074c6846f4aea04bd31d7652a26871164b16ee3afff466  /usr/local/bin/aspect" | sha256sum -c -
              chmod +x /usr/local/bin/aspect
              curl -fsSLo /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
              echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  /usr/local/bin/bazel" | sha256sum -c -
              chmod +x /usr/local/bin/bazel

              export KRABKA_MUTANTS_LOG_DIR="$PWD/mutants"
              export KRABKA_MUTANTS_SCRATCH_DIR=/tmp/krabka-mutants
              export KRABKA_MUTANTS_JOBS=8
              status=0
              aspect mutants "$KRABKA_CRATE" "$KRABKA_PART" "$KRABKA_PARTS" || status=$?

              mkdir -p "evidence/bazel-testlogs/crates/$KRABKA_CRATE" evidence/mutants
              target="bazel-testlogs/crates/$KRABKA_CRATE/${KRABKA_CRATE}_mutants"
              if [ -d "$target" ]; then
                cp -R "$target" "evidence/bazel-testlogs/crates/$KRABKA_CRATE/"
              fi
              if [ -d mutants ]; then
                cp -R mutants/. evidence/mutants/
              fi
              artifact="$BUILDBUDDY_ARTIFACTS_DIRECTORY/mutants-$KRABKA_CRATE-part-$KRABKA_PART.tar.gz"
              tar -C evidence -czf "$artifact" .
              sha256sum "$artifact"

              rm -rf /tmp/krabka-mutants "$PWD/mutants" "$PWD/evidence"
              bazel clean --expunge >/dev/null 2>&1 || true
              exit "$status"
          REMOTE_SCRIPT
          )"

          request="$(jq -cn \
            --arg repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg script "$script" \
            --arg crate "$CRATE" \
            --arg part "$PART" \
            --arg parts "$PARTS" \
            '{
              repo: $repo,
              commit_sha: $commit_sha,
              steps: [{run: $script}],
              env: {
                PATH: "/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                KRABKA_CRATE: $crate,
                KRABKA_PART: $part,
                KRABKA_PARTS: $parts
              },
              platform_properties: {
                OSFamily: "linux",
                Arch: "amd64",
                "container-image": "docker://docker.io/library/rust@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97",
                dockerUser: "root",
                EstimatedCPU: "16",
                EstimatedMemory: "64GB",
                EstimatedFreeDiskBytes: "200GB"
              },
              timeout: "5h30m"
            }')"
          response="$(curl -fsS --retry 9 --retry-all-errors --retry-delay 3 \
            -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$request" \
            https://app.buildbuddy.io/api/v1/Run)"
          invocation_id="$(jq -r '.invocationId // .invocation_id // empty' <<<"$response")"

          test -n "$invocation_id"
          echo "invocation_id=${invocation_id}" >>"${GITHUB_OUTPUT}"
          echo "BuildBuddy invocation: https://app.buildbuddy.io/invocation/${invocation_id}"

          invocation_request="$(jq -cn --arg id "$invocation_id" \
            '{selector:{invocation_id:$id},include_artifacts:true}')"
          deadline=$((SECONDS + 20100))
          while ((SECONDS < deadline)); do
            curl -fsS --retry 9 --retry-all-errors --retry-delay 3 \
              -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d "$invocation_request" \
              https://app.buildbuddy.io/api/v1/GetInvocation >"${RUNNER_TEMP}/invocation.json"
            invocation_status="$(jq -r '.invocation[0].invocationStatus // empty' \
              "${RUNNER_TEMP}/invocation.json")"
            echo "BuildBuddy status: ${invocation_status:-pending}"
            case "$invocation_status" in
              COMPLETE_INVOCATION_STATUS|DISCONNECTED_INVOCATION_STATUS) break ;;
            esac
            sleep 30
          done

          page_token=""
          : >"$log"
          while true; do
            log_request="$(jq -cn --arg id "$invocation_id" --arg token "$page_token" \
              '{selector:{invocation_id:$id}} + if $token == "" then {} else {page_token:$token} end')"
            curl -fsS --retry 9 --retry-all-errors --retry-delay 3 \
              -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d "$log_request" \
              https://app.buildbuddy.io/api/v1/GetLog >"${RUNNER_TEMP}/log.json"
            jq -r '.log.contents // ""' "${RUNNER_TEMP}/log.json" | tee -a "$log"
            page_token="$(jq -r '.nextPageToken // .next_page_token // empty' \
              "${RUNNER_TEMP}/log.json")"
            [ -n "$page_token" ] || break
          done

          test "$invocation_status" = COMPLETE_INVOCATION_STATUS
          test "$(jq -r '.invocation[0].success' "${RUNNER_TEMP}/invocation.json")" = true
      - name: download remote evidence
        if: always() && steps.remote.outputs.invocation_id != ''
        env:
          CRATE: ${{ env.MUTANTS_CRATE }}
          PART: ${{ matrix.part }}
          INVOCATION_ID: ${{ steps.remote.outputs.invocation_id }}
        run: |
          set -euo pipefail
          package="${RUNNER_TEMP}/package"
          mkdir -p "$package/provenance"
          response="$package/provenance/invocation-part-${PART}.json"
          request="$(jq -cn --arg id "$INVOCATION_ID" '{selector:{invocation_id:$id},include_artifacts:true}')"
          artifact=""
          for _ in $(seq 1 10); do
            if curl -fsS \
              -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}" \
              -H 'Content-Type: application/json' \
              -d "$request" \
              https://app.buildbuddy.io/api/v1/GetInvocation >"$response" && \
              artifact="$(jq -r --arg suffix "mutants-${CRATE}-part-${PART}.tar.gz" \
                '.invocation[0].artifacts[]? | select(.name | endswith($suffix)) | .uri' \
                "$response")" && [ -n "$artifact" ]; then
              break
            fi
            artifact=""
            sleep 3
          done
          test -n "$artifact"
          uri="$artifact"
          blob="${uri%/*}"
          expected_sha="${blob##*/}"
          archive="${RUNNER_TEMP}/mutants-${CRATE}-part-${PART}.tar.gz"
          file_request="$(jq -cn --arg uri "$uri" '{uri:$uri}')"
          curl -fsS --retry 9 --retry-all-errors --retry-delay 3 \
            --output "$archive" \
            -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary "$file_request" \
            https://app.buildbuddy.io/api/v1/GetFile
          echo "${expected_sha}  ${archive}" | sha256sum -c -
          tar -C "$package" -xzf "$archive"
          cp "${RUNNER_TEMP}/buildbuddy-${CRATE}-part-${PART}.log" \
            "$package/provenance/remote-part-${PART}.log"
          sha256sum "$archive" >"$package/provenance/artifact-part-${PART}.sha256"
      - name: upload part evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ env.MUTANTS_CRATE }}-part-${{ matrix.part }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error

  ratchet:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: mutants-${{ env.MUTANTS_CRATE }}-part-*
          path: .
          merge-multiple: true
      - name: apply ratchet
        run: |
          set -o pipefail
          tools/mutants-ratchet.py "${MUTANTS_CRATE}" ${{ inputs.record && '--record' || '' }} | tee mutants-ratchet.txt
      - name: upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ env.MUTANTS_CRATE }}-complete
          path: |
            bazel-testlogs/
            mutants/
            provenance/
            mutants-ratchet.txt
          if-no-files-found: error
