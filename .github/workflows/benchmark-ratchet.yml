name: benchmark ratchet

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      record:
        description: Print a replacement baseline instead of applying the ratchet
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmark-ratchet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - id: shards
        name: select every benchmark group
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import runpy
          import sys
          import tomllib

          sys.path.insert(0, "tools")
          ratchet = runpy.run_path("tools/bench-ratchet.py")
          targets = ratchet["bench_targets"]("benches/benches")
          baseline = ratchet["read_baseline"](pathlib.Path("tools/bench-baseline.txt"))
          groups = {name.split("/", 1)[0] for name in baseline}
          manifest = tomllib.loads(pathlib.Path("benches/Cargo.toml").read_text())
          declared = {bench["name"] for bench in manifest["bench"]}
          if groups != set(targets) or declared != set(targets.values()):
              raise SystemExit("benchmark groups, baseline and Cargo targets disagree")
          if not groups or any(not ratchet["BENCHMARK_ID"].fullmatch(name)
                               for name in groups | declared):
              raise SystemExit("benchmark shard names must be nonempty safe identifiers")
          shards = [{"group": group, "target": targets[group]} for group in sorted(groups)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("shards=" + json.dumps(shards, separators=(",", ":")), file=output)
          PYTHON
  benchmark-ratchet:
    name: benchmark ratchet · ${{ matrix.shard.group }}
    needs: select
    runs-on: ubuntu-26.04
    # BuildBuddy's free tier kills each remote run after one hour. Measure one
    # Criterion group per invocation, including index_load in index_prune.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      BENCH_GROUP: ${{ matrix.shard.group }}
      BENCH_TARGET: ${{ matrix.shard.target }}
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - name: install BuildBuddy CLI
        run: curl -fsSL https://install.buildbuddy.io | bash
      - name: run numeric ratchet remotely
        id: measure
        run: |
          set -uo pipefail
          status=0
          bb remote \
            --os=linux \
            --arch=amd64 \
            --container_image=docker://docker.io/library/rust@sha256:e259494b14672950a909b4c54527e19d29cae6ebf980672114c8bb85e5594e4a \
            --env=PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --run_from_commit="${GITHUB_SHA}" \
            --env=KRABKA_BENCH_GROUP="${BENCH_GROUP}" \
            --env=KRABKA_BENCH_TARGET="${BENCH_TARGET}" \
            --env=KRABKA_BENCH_FILTER="^${BENCH_GROUP}/" \
            --timeout=55m \
            --disable_retry \
            --runner_exec_properties=dockerUser=root \
            --runner_exec_properties=EstimatedCPU=16 \
            --runner_exec_properties=EstimatedMemory=64GB \
            --runner_exec_properties=EstimatedFreeDiskBytes=200GB \
            --script='
              status=0
              verdict="$BUILDBUDDY_ARTIFACTS_DIRECTORY/verdict.json"
              tools/bench.sh "$KRABKA_BENCH_TARGET" &&
                tools/bench-ratchet.py --bench "$KRABKA_BENCH_GROUP" ${{ inputs.record && '--record' || '--json "$verdict"' }} || status=$?
              # The runner step reads the ratchet exit code and the verdict
              # back out of these lines, and does not depend on bb remote
              # passing the exit code through.
              echo "krabka-status=$status"
              if [ -f "$verdict" ]; then
                printf "krabka-verdict=%s\n" "$(base64 -w0 "$verdict")"
              fi
              if [ -d benches/target/criterion ]; then
                cat benches/target/criterion/run.metadata.txt || true
                tar -C benches/target -czf \
                  "$BUILDBUDDY_ARTIFACTS_DIRECTORY/criterion.tar.gz" criterion
                sha256sum "$BUILDBUDDY_ARTIFACTS_DIRECTORY/criterion.tar.gz"
              fi
              exit "$status"
            ' | tee remote.log || status=$?
          reported=$(grep -o 'krabka-status=[0-9]*' remote.log | tail -n 1 | cut -d= -f2)
          if [ -n "$reported" ]; then
            status=$reported
          elif [ "$status" -eq 0 ]; then
            echo "::error::the remote run printed no ratchet exit code"
            exit 1
          fi
          case "$status" in
            0) ;;
            # Exit 1 is a steady measurement over its budget. One slow host
            # gives that too, so the next step reruns those benchmarks on a
            # second remote runner, and fails only if one reproduces.
            1)
              grep -o 'krabka-verdict=[A-Za-z0-9+/=]*' remote.log | tail -n 1 \
                | cut -d= -f2- >verdict.b64
              if [ ! -s verdict.b64 ]; then
                echo "::error::the ratchet exited 1 and printed no verdict"
                exit 1
              fi
              echo "confirm=true" >>"$GITHUB_OUTPUT"
              ;;
            # Exit 4 is runner variance: a measurement too noisy to gate.
            # Report it, and pass.
            4) echo "benchmark ratchet: runner variance, not a regression" ;;
            *) exit "$status" ;;
          esac
      - name: confirm the regression on a second remote runner
        if: steps.measure.outputs.confirm == 'true'
        run: |
          set -euo pipefail
          # A separate invocation with runner recycling off, so BuildBuddy
          # schedules a fresh runner and does not reuse the one that measured
          # the first run. The scheduler can still place it on the same
          # machine; the run.metadata.txt of both runs names the host.
          bb remote \
            --os=linux \
            --arch=amd64 \
            --container_image=docker://docker.io/library/rust@sha256:e259494b14672950a909b4c54527e19d29cae6ebf980672114c8bb85e5594e4a \
            --env=PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env=KRABKA_FIRST_VERDICT="$(cat verdict.b64)" \
            --run_from_commit="${GITHUB_SHA}" \
            --env=KRABKA_BENCH_TARGET="${BENCH_TARGET}" \
            --timeout=55m \
            --disable_retry \
            --runner_exec_properties=dockerUser=root \
            --runner_exec_properties=recycle-runner=false \
            --runner_exec_properties=EstimatedCPU=16 \
            --runner_exec_properties=EstimatedMemory=64GB \
            --runner_exec_properties=EstimatedFreeDiskBytes=200GB \
            --script='
              status=0
              first="$BUILDBUDDY_ARTIFACTS_DIRECTORY/verdict.json"
              printf "%s" "$KRABKA_FIRST_VERDICT" | base64 -d >"$first"
              # Build before the rerun, with the profile tools/bench.sh sets,
              # so that --confirm-timeout bounds the measurement and not a
              # cold build.
              CARGO_PROFILE_BENCH_DEBUG=0 cargo bench \
                --manifest-path benches/Cargo.toml --locked \
                --bench "$KRABKA_BENCH_TARGET" --no-run || exit 1
              # At most four benchmarks, the worst first, for at most ten
              # minutes.
              tools/bench-ratchet.py --confirm "$first" \
                --confirm-limit 4 --confirm-timeout 600 \
                --json "$BUILDBUDDY_ARTIFACTS_DIRECTORY/confirm.json" || status=$?
              if [ -d benches/target/criterion-confirm ]; then
                cat benches/target/criterion-confirm/run.metadata.txt || true
                tar -C benches/target -czf \
                  "$BUILDBUDDY_ARTIFACTS_DIRECTORY/criterion-confirm.tar.gz" criterion-confirm
                sha256sum "$BUILDBUDDY_ARTIFACTS_DIRECTORY/criterion-confirm.tar.gz"
              fi
              # Exit 4 is a regression that did not reproduce: runner
              # variance, not a finding.
              if [ "$status" -eq 4 ]; then
                echo "benchmark ratchet: runner variance, not a regression"
                status=0
              fi
              exit "$status"
            '
