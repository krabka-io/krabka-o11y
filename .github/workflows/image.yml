name: image

# Builds and publishes the image //bazel/images/krabka describes.
#
# It is a Bazel build, not a `docker build`. The binaries in the image are the
# `rust_binary` outputs the `ci` workflow tests, rather than a third build of
# the same sources inside a `rust:` container -- see //bazel/images/krabka for
# why that distinction is the point.
#
# Cost: one ubuntu-latest job, the same 90-minute budget the `ci` job carries.
# It compiles the workspace at `-c opt`, which `ci` does not -- that job builds
# fastbuild -- so the two do not share a cache. The job it replaces ran a full
# `cargo build --locked --release` inside buildx on every trigger with no
# Bazel cache at all, so a warm run here is cheaper and a cold run comparable.

on:
  pull_request:
    paths:
      - .github/workflows/image.yml
      - MODULE.bazel
      - MODULE.bazel.lock
      - bazel/images/krabka/**
      - deploy/**
      - docs/releases/**
      - qualification/**
      - tools/qualification-gate.py
      - tools/qualification-report.py
      - tools/release-smoke.sh
      - Cargo.lock
      - Cargo.toml
      - crates/**
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  artifact-metadata: write
  contents: read
  issues: read
  packages: write
  id-token: write
  # For actions/attest-build-provenance. The attestation is attached to the
  # single-platform delivery digest or multi-platform release digest here.
  attestations: write

jobs:
  release-gate:
    name: qualified release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      qualified-run: ${{ steps.qualification.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: require exact qualification and completed prerequisites
        id: qualification
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for issue in 272 273 274; do
            test "$(gh issue view "${issue}" --json state --jq .state)" = CLOSED
          done
          run="$(gh run list --workflow qualification.yml --commit "${GITHUB_SHA}" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "${run}"
          gh run download "${run}" \
            --name "milestone-21-qualification-${GITHUB_SHA}" --dir qualified
          tools/qualification-report.py \
            --report qualified/milestone-21-qualified.json \
            --final --commit "${GITHUB_SHA}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  # Two minutes, no Bazel. It catches the manifest errors that only appear when
  # something renders them: a kustomize base that will not build, or a compose
  # file with an undefined anchor. `//deploy:role_config_test` covers the other
  # half, which is a config key that names no flag.
  manifests:
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: kustomize
        run: kubectl kustomize deploy > /dev/null
      - name: compose
        run: docker compose -f deploy/compose/docker-compose.yaml config --quiet

  image:
    name: build · publish
    needs: [manifests, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # The same reclamation the `ci` job does, for the same reason: the runner
      # ships ~25 GB of toolchains no Bazel action touches, and an opt build of
      # this workspace does not fit beside them.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h /
      - name: build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bazel build -c opt //bazel/images/krabka:image_manifest_blob
      # ARM64 is intentionally release-only: PRs and main pushes keep the
      # existing AMD64 build, while a v* tag builds the two-platform index.
      - name: build release image
        if: startsWith(github.ref, 'refs/tags/')
        run: bazel build -c opt //bazel/images/krabka:image_multiarch_index_blob
      - name: digest
        id: digest
        run: |
          target=image_manifest_blob
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            target=image_multiarch_index_blob
          fi
          manifest="$(bazel cquery -c opt //bazel/images/krabka:${target} --output=files)"
          echo "digest=sha256:$(sha256sum "${manifest}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bazel run -c opt //bazel/images/krabka:push -- --tag "sha-${GITHUB_SHA::12}"
      - name: publish release image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          git fetch --tags --force origin
          newest="$(git tag --list 'v*' | sort -V | tail -1)"
          tags=("${GITHUB_REF#refs/tags/}" "sha-${GITHUB_SHA::12}")
          if [ "${newest}" = "${GITHUB_REF#refs/tags/}" ]; then
            tags+=(latest)
          fi

          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "${tag}")
          done
          bazel run -c opt //bazel/images/krabka:push_multiarch -- "${arguments[@]}"

          for tag in "${tags[@]}"; do
            actual="$(docker buildx imagetools inspect "ghcr.io/krabka-io/krabka-o11y:${tag}" |
              awk '$1 == "Digest:" { print $2; exit }')"
            test "${actual}" = "${EXPECTED_DIGEST}"
          done
      - name: attest provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/krabka-io/krabka-o11y
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  release:
    name: release · qualify published digest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [image, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/krabka-io/krabka-o11y@${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: verify release platforms are pullable
        run: |
          mkdir -p release-assets
          for platform in linux/arm64 linux/amd64; do
            docker pull --platform "${platform}" "${IMAGE}"
            printf '%s %s\n' "${platform}" "${IMAGE}" >> release-assets/platforms.txt
          done
      - name: clean four-signal install and query smoke
        run: tools/release-smoke.sh "${IMAGE}" "" release-assets/smoke
      - name: generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: release-assets/sbom.spdx.json
          upload-artifact: false
      - name: attest release provenance
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/krabka-io/krabka-o11y
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
      - name: attest release SBOM
        id: sbom-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/krabka-io/krabka-o11y
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: release-assets/sbom.spdx.json
          push-to-registry: true
      - name: assemble and publish release
        env:
          QUALIFICATION_RUN: ${{ needs.release-gate.outputs.qualified-run }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          test -f "docs/releases/${tag}.md"
          gh run download "${QUALIFICATION_RUN}" \
            --name "milestone-21-qualification-${GITHUB_SHA}" --dir release-assets
          cp "${PROVENANCE_BUNDLE}" release-assets/provenance.jsonl
          cp "${SBOM_BUNDLE}" release-assets/sbom-attestation.jsonl
          printf '%s\n' "${IMAGE}" > release-assets/image.txt
          tar -C release-assets -czf release-assets/four-signal-smoke.tgz smoke
          rm -rf release-assets/smoke
          (cd release-assets && find . -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > SHA256SUMS)
          gh release create "${tag}" release-assets/* \
            --verify-tag --title "krabka-o11y ${tag}" \
            --notes-file "docs/releases/${tag}.md"
