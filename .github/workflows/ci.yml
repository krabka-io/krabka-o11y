name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 05:00 UTC: Cargo tests, coverage, fuzzing and benchmarks.
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  # The Aspect CLI uploads test logs and BEP through the Actions artifact
  # API, which GitHub gates behind an OIDC token it only mints for jobs
  # holding this. Without it those uploads are skipped and the run says so
  # on every job.
  id-token: write
# Cancel superseded PR runs; let pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Require only this stable check in branch protection. Always evaluate the
  # results so a failed, cancelled, or skipped dependency cannot pass the gate.
  gate:
    name: CI gate
    if: always() && github.event_name != 'schedule'
    needs: [ci, cargo, deny, tools, docs, website]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${RESULTS}"
          jq -e 'all(.[]; .result == "success")' <<<"${RESULTS}"
  # The main Bazel lane runs on BuildBuddy remote runners. Keep the existing
  # non-container test set and report its result through the same CI gate.
  ci:
    name: build · test · lint · format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Three separate remote invocations, each below the one-hour plan limit.
    timeout-minutes: 180
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      # Forks do not receive organization secrets and keep a local build path.
      BUILDBUDDY_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: install BuildBuddy CLI
        if: env.BUILDBUDDY_API_KEY != ''
        run: |
          set -euo pipefail
          directory="${RUNNER_TEMP}/buildbuddy-cli"
          mkdir -p "${directory}"
          curl -fsSL https://github.com/buildbuddy-io/bazel/releases/download/5.0.493/bazel-5.0.493-linux-x86_64 -o "${directory}/bb"
          echo "557d731cd912b73184de9ca03baae6c95305479b5203375da312f150b05c5caa  ${directory}/bb" | sha256sum -c -
          chmod +x "${directory}/bb"
          echo "${directory}" >> "${GITHUB_PATH}"
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          # The shared cache expands past 25 GiB and leaves too little room for
          # a clean Rust dependency rebuild.
          disk-cache: false
          repository-cache: true
      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          upload: ${{ github.event_name != 'pull_request' }}
      # Only fork PRs compile on the GitHub runner. Remote builds have their
      # own CPU, memory and disk allocation and do not need this reclamation.
      - name: free disk
        if: env.BUILDBUDDY_API_KEY == ''
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          #
          # Two paths are deliberately absent, both of which this step deleted
          # once and had to stop. `/opt/hostedtoolcache` is where the toolchain
          # actions install, and this step runs after them.
          # `/usr/local/lib/node_modules` holds bazelisk, which
          # `/usr/local/bin/bazel` is a symlink into -- removing it left the
          # symlink dangling and `aspect format` failed with `No such file or
          # directory` from inside the CLI, naming neither bazel nor the file.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      # `--severity` defaults to `auto`, which the CLI resolves to `fail` on CI
      # and `info` off it -- so this gates here and only reports locally.
      - name: format
        run: aspect format
      # Use the same Clippy aspect as `aspect lint`, with violations fatal.
      # A remote runner needs only Bazel; the Aspect CLI stays on the launcher
      # for the formatting step above.
      - name: lint
        run: tools/remote-bazel.sh build --config=lint --@aspect_rules_lint//lint:fail_on_violation //... --build_tag_filters=-docker,-scale
      - name: build
        run: tools/remote-bazel.sh build //... --build_tag_filters=-docker,-scale
      - name: test
        run: tools/remote-bazel.sh test //... --build_tests_only
  # Cargo, gated. Bazel is what the rest of CI builds with, but the two are not
  # the same build, so the cargo path can break with nothing to say so:
  # //bazel/defs.bzl strips the `vendored-protoc` feature and hands `PROTOC` to
  # the build scripts, it applies the workspace lint set by hand because
  # rules_rs does not read Cargo lint tables, and no Bazel action reads
  # //.cargo/config.toml. This job is the only place any of that runs.
  #
  # `--locked` is the second reason to have it. rules_rs resolves from
  # `Cargo.lock` through `crate.from_cargo`, so a manifest edited without a
  # regenerated lockfile breaks the Bazel build too. This reports that in
  # seconds instead of leaving it to a stale-looking build failure.
  #
  # PRs compile the Cargo test targets without running the Bazel suite again.
  # Nightly and manual runs execute the Cargo tests. Container suites remain
  # ignored under Cargo and run in release-tests.yml.
  cargo:
    name: cargo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Debug info is the bulk of what a `cargo test --workspace` writes, and
    # none of it is read here: nothing debugs a CI run, and a backtrace from a
    # failing test needs symbols, which `debug = 0` keeps. Dropping it is what
    # makes the build fit the runner, and it links faster for the same reason.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from `rust-toolchain.toml` rather than being named
      # again here. The action needs the input, so it is read out of the file
      # the rest of the repo already resolves against.
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # A runner ships ~25 GB of toolchains this build never touches, and the
      # link step below ran the disk out without them gone: `cargo test
      # --workspace` links a test binary per target on top of the DataFusion
      # pin, and ENOSPC during linking surfaces as `ld terminated with signal
      # 7 [Bus error]`, which reads like a compiler bug rather than a full
      # disk.
      - name: free disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          #
          # Two paths are deliberately absent, both of which this step deleted
          # once and had to stop. `/opt/hostedtoolcache` is where the toolchain
          # actions install, and this step runs after them.
          # `/usr/local/lib/node_modules` holds bazelisk, which
          # `/usr/local/bin/bazel` is a symlink into -- removing it left the
          # symlink dangling and `aspect format` failed with `No such file or
          # directory` from inside the CLI, naming neither bazel nor the file.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      # Without this, every run compiles the whole DataFusion pin from source,
      # which is most of the wall clock here. The cache key covers `Cargo.lock`
      # and the `CARGO_*` environment, so the two `CARGO_PROFILE_*` variables
      # below are part of it -- they are set for the job rather than per step
      # so the cached artifacts and the ones this job builds agree.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Two hand-written lists name the crates the sibling repositories hold:
      # `[patch.crates-io]` in Cargo.toml and `SIBLING_MEMBERS` in
      # MODULE.bazel. The script reads the pinned checkouts through `cargo
      # metadata`, so it needs a resolved dependency graph, which a sandboxed
      # Bazel test does not have. Running it here catches a hand edit to either
      # list on the pull request that makes it. It comes first because it takes
      # about a second.
      - name: sibling crate lists
        run: tools/check-sibling-members.sh
      - name: check test targets
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: cargo check --workspace --all-targets --locked
      - name: test
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo test --workspace --locked
      # `heap-profiling` swaps the global allocator for jemalloc in each
      # service binary, behind a `cfg`. No Bazel target turns the feature on,
      # so `bazel test //...` never compiles those lines -- and the clippy
      # aspect that gates the rest of the workspace never reads them either.
      # This is the only lint those lines get, so it is clippy rather than
      # `cargo check`: the first compilation of this feature turned up five
      # unused imports that nothing had ever been in a position to report.
      - name: heap-profiling
        run: |
          cargo clippy --locked --features heap-profiling --all-targets \
            -p krabka-metrics \
            -p krabka-metrics-service \
            -p krabka-observability \
            -p krabka-profiles \
            -p krabka-traces \
            -- -D warnings
  # Supply-chain policy, from //deny.toml. That file names the advisories this
  # workspace accepts and the licenses and sources it allows, and until this
  # job existed nothing read it. It had drifted far enough to fail on its first
  # run.
  #
  # `sources` is the half that earns a place on every pull request: it fails on
  # any git or registry source //deny.toml does not name, so a new unpinned
  # remote cannot arrive unnoticed. `advisories` reads the RustSec database,
  # which moves without a change here, so this job can turn red on a pull
  # request that did not touch a dependency. That is what it is for.
  #
  # cargo-deny is pinned to a version, not left to float, so the same commit
  # gets the same result from the tool. The job compiles nothing and holds no
  # cache. It does fetch twice: the git dependencies, because `cargo metadata`
  # reads their manifests, and the RustSec advisory database.
  deny:
    name: cargo-deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories bans licenses sources
  # The repository's own Python tools, checked against synthetic input.
  #
  # //tools/mutants-ratchet.py decides whether a mutation sweep passes. Sweeps
  # run for hours and hold a machine for the whole run, so they never run in
  # CI; a maintainer runs one by hand on a dedicated host. A fault in the ratchet
  # would therefore surface only on that rare manual run. Its `--self-test`
  # builds the shard logs a sweep writes, including the killed and refusing
  # shards that a real run cannot be asked to produce, and checks the verdict
  # for each. It needs no Bazel, no toolchain and about a second, so it runs on
  # every pull request. It is not itself mutation testing.
  tools:
    name: tool self-tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          repository-cache: true
      - run: aspect mutants --self-test
      - run: tools/mutants-ratchet.py --self-test
      # //tools/bench-ratchet.py reads a Criterion run and decides whether the
      # benchmarks may pass. Its `--self-test` drives those checks against
      # synthetic estimates files, so it needs no benchmark run -- which is the
      # point: the `bench` job below is nightly, and a ratchet developed only
      # against it would be checked once a day.
      - run: tools/bench-ratchet.py --self-test
      # //tools/object-store-evidence.py gates the manual `object-store
      # contract` workflow, which needs provider credentials. Its `--self-test`
      # checks synthetic evidence, so a fault shows on the pull request.
      - run: tools/object-store-evidence.py --self-test
      # //tools/soak-gate.py reads the operating-envelope soak's report. Its
      # `--self-test` drives the structural check, the baseline ratchet and the
      # envelope computation against synthetic reports, so it needs no soak:
      # the soak runs at release time, so its gate needs a faster check here.
      - run: tools/soak-gate.py --self-test
      - run: python3 tools/deployment-envelope.py --self-test
      - run: python3 tools/compare-grafana.py --self-test
      - run: python3 tools/test_profile_grafana.py
      # //tools/mutants-record.py checks the two Milestone 19 records under
      # //qualification. Each record must name the commit, toolchain, host
      # shape, command, duration and checksums of its run, and each number in
      # //tools/mutants-baseline.txt and //tools/bench-baseline.txt must match
      # its record. It reads JSON and text and runs no sweep.
      - run: tools/mutants-record.py --self-test
      - run: tools/mutants-record.py --check
      # //tools/fuzz-corpus.py writes the seed corpora under //fuzz/corpus, and
      # its `--self-test` checks the varint, zigzag, snappy and protobuf
      # encoders it writes them with against encodings the formats fix. It
      # reads nothing from the repository, so it runs on a bare checkout.
      - run: tools/fuzz-corpus.py --self-test
      # `--check` regenerates the corpora and fails on a seed that is missing
      # or has moved, so a fixture edit that changes what the seeds mine cannot
      # leave a stale corpus behind. It checks the fuzz targets against
      # //fuzz/Cargo.toml as well: a target file with no `[[bin]]` entry is a
      # file cargo-fuzz never builds and never runs, which reads as covered
      # surface and is not.
      - run: tools/fuzz-corpus.py --check
      - run: tools/route-inventory.py --self-test
      - run: tools/route-inventory.py --check
      - run: tools/upstream-surface.py --self-test
      - run: tools/upstream-surface.py --check
      - run: python3 tools/query-language-inventory.py --check
      - run: python3 tools/query-language-inventory.py --self-check
      - run: python3 tools/query-language-evidence.py --self-check
      - run: python3 tools/query-language-report.py --self-check
      - run: python3 tools/build-query-runners.py --self-test
      - run: tools/upstream-drift.py --self-test
      - run: tools/upstream-drift.py --check
      - run: tools/otlp-contracts.py --self-test
      - run: tools/qualification-gate.py --self-test
      - run: tools/qualification-report.py --self-test
      - run: tools/qualification-report.py --check
      # //fuzz is a workspace of its own, so it repeats the sibling pins from
      # //Cargo.toml. A bump to one copy knows nothing about the other. This
      # fails on the drift.
      - run: tools/check-fuzz-patch.sh
  # Auxiliary workspaces are checked nightly and on manual dispatch. They
  # live outside the root workspace, so the normal Bazel/Cargo lane omits them.
  # Fuzz targets require nightly; benchmark checks use the pinned stable Rust.
  fuzz-build:
    name: fuzz targets compile
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A cold run checks the whole DataFusion pin. A warm one takes minutes.
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --all-targets -- -D warnings
  bench-build:
    name: benchmarks compile
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A cold run checks the whole DataFusion pin. A warm one takes minutes.
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # Stable, from `rust-toolchain.toml`, unlike the fuzz jobs above: nothing
      # here needs nightly, and the benchmarks measure what the pinned
      # toolchain compiles.
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: benches
      - run: cargo clippy --manifest-path benches/Cargo.toml --locked --all-targets -- -D warnings
  # Coverage repeats the test suite with instrumentation, so reserve it for
  # nightly and manual runs instead of running every PR's tests twice.
  coverage:
    name: coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          bazelisk-cache: true
          # Coverage output plus the restored cache exceeds the 75 GiB freed
          # below; keep only the output needed by this run.
          disk-cache: false
          repository-cache: true
      - uses: ./.github/actions/remote-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          client-cert: ${{ secrets.BUILDBUDDY_CLIENT_CERT }}
          client-key: ${{ secrets.BUILDBUDDY_CLIENT_KEY }}
          upload: ${{ github.event_name != 'pull_request' }}
      # Instrumented binaries are far larger than a normal build, and this job
      # links every test target in the workspace. It ran the runner's disk to
      # 15 MB free and the link died as `clang++: Bus error (core dumped)`,
      # which reads like an LLVM crash rather than a full disk -- the same
      # disguise ENOSPC wears in the `cargo` job above. The runner ships ~25 GB
      # of toolchains no Bazel action here touches.
      - name: free disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          #
          # Two paths are deliberately absent, both of which this step deleted
          # once and had to stop. `/opt/hostedtoolcache` is where the toolchain
          # actions install, and this step runs after them.
          # `/usr/local/lib/node_modules` holds bazelisk, which
          # `/usr/local/bin/bazel` is a symlink into -- removing it left the
          # symlink dangling and `aspect format` failed with `No such file or
          # directory` from inside the CLI, naming neither bazel nor the file.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      - run: bazel coverage //crates/...
      # //codecov.yml holds the informational status for this report. Read
      # that file before reading a percentage from it -- the coverage run skips
      # the container suites and the timing-sensitive ones, so the number is
      # lower than the truth.
      #
      # `fail_ci_if_error` was false, which made a rejected or lost upload
      # silent: the job stayed green and Codecov reported the previous run's
      # numbers, or none. An upload that does not arrive is a coverage result
      # nobody has, so it fails here.
      - uses: codecov/codecov-action@v7
        with:
          files: bazel-out/_coverage/_coverage_report.dat
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
  # One workspace rustdoc tree, kept as an artifact. Independent Bazel
  # `rust_doc` trees each carry their own search index, so merging them would
  # leave search and source links for only the last crate copied.
  docs:
    name: docgen
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          test -n "${channel}"
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
      - name: add site index
        run: cp docs/rustdoc_index.html target/doc/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: target/doc
          if-no-files-found: error
  website:
    name: website · full WASI lab
    if: github.event_name != 'schedule'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        working-directory: website
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' ../rust-toolchain.toml)"
          test -n "${channel}"
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - run: npm ci
      - name: check documentation import and source staging
        run: |
          npm test
          node scripts/check-site.mjs --self-test
          python3 -B scripts/prepare-wasix-test.py
          CARGO_TARGET_DIR="${PWD}/.tools/http-native-target" cargo clippy --manifest-path wasi-client/Cargo.toml --locked --all-targets -- -D warnings
          CARGO_TARGET_DIR="${PWD}/.tools/http-native-target" cargo test --manifest-path wasi-client/Cargo.toml --locked
      - name: build production services and static site
        env:
          # Authenticate toolchain release downloads and std submodule lookups.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tools
          npm run build 2>&1 | tee .tools/lab-build.log
          npm run check
      - uses: actions/download-artifact@v8
        with:
          name: rustdoc
          path: website/.tools/site-combined
      - name: check website links into the Rust API reference
        run: |
          cp -R dist/. .tools/site-combined/
          node scripts/check-site.mjs .tools/site-combined --rustdoc
      - run: npx playwright install --with-deps chromium
      - name: verify website and real browser services
        run: |
          set -euo pipefail
          node scripts/preview.mjs --dir .tools/site-combined --port 4322 >.tools/preview.log 2>&1 &
          site_preview_pid=$!
          trap 'kill "${site_preview_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4322/krabka-o11y/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-check.mjs --url http://127.0.0.1:4322/krabka-o11y/ 2>&1 | tee .tools/browser-check.log
          node scripts/network-check.mjs 2>&1 | tee .tools/network-check.log
          node scripts/lab-check.mjs 2>&1 | tee .tools/lab-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-check-evidence
          include-hidden-files: true
          path: |
            website/.tools/*.log
            website/.tools/screenshots
            website/static/lab/manifest.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/dist
          if-no-files-found: error
  publish-docs:
    name: publish website and rustdoc
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, website]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: rustdoc
          path: _site
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: _site
      - name: verify site
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          test -f _site/krabka_blockstore/index.html
          test -f _site/krabka_traces/index.html
          test -f _site/lab/manifest.json
          node website/scripts/check-site.mjs _site --rustdoc
          python3 - <<'PY'
          from pathlib import Path
          size = sum(path.stat().st_size for path in Path('_site').rglob('*') if path.is_file())
          if size > 1_000_000_000:
              raise SystemExit(f'The {size:,}-byte site exceeds the GitHub Pages limit.')
          print(f'Combined website and Rust API reference: {size:,} bytes.')
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
  # The fuzz targets, run. Scheduled rather than a gate on a pull request,
  # because instrumented builds and exploration need a separate budget.
  #
  # //tools/fuzz.sh holds the flags, so a local run and this job run the same
  # way. It builds every target once, then gives each one its own bounded
  # budget, so a slow target cannot take the whole run. It copies //fuzz/corpus
  # into a scratch directory first, so a run never edits the checked-in seeds.
  #
  # Sixty seconds a target is a short budget, and most of this job is the
  # build. What that buys every night is the seed corpus re-run, which is the
  # regression half, plus a short exploration from wherever the seeds reach.
  # Nothing carries over between runs: each night starts from the checked-in
  # seeds again. Caching the grown corpus between runs would find more, and it
  # would need a cache policy this job does not have yet.
  #
  # A run that finds nothing is the expected result and says the decoders held
  # for that budget. It is not a proof, and the budget is what a scheduled job
  # can report on rather than a number with a meaning of its own.
  #
  # libFuzzer writes the input for a finding under fuzz/artifacts/<target>/.
  # That upload is the whole report, so it runs even when the step above
  # failed, which is the only case that produces one.
  fuzz:
    name: fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A bound, not an estimate.
    # A cold run links fourteen instrumented binaries on top of the DataFusion
    # pin; a warm one spends most of the time fuzzing.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: rust-src
      # Thirteen instrumented binaries on top of the DataFusion pin, each one
      # statically linked. A runner ships ~25 GB of toolchains this build never
      # touches, and the link step is where a full disk shows up -- as `ld
      # terminated with signal 7 [Bus error]`, which reads like a compiler bug.
      - name: free disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          #
          # Two paths are deliberately absent, both of which this step deleted
          # once and had to stop. `/opt/hostedtoolcache` is where the toolchain
          # actions install, and this step runs after them.
          # `/usr/local/lib/node_modules` holds bazelisk, which
          # `/usr/local/bin/bazel` is a symlink into -- removing it left the
          # symlink dangling and `aspect format` failed with `No such file or
          # directory` from inside the CLI, naming neither bazel nor the file.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      # `cargo install` rather than taiki-e/install-action, which the
      # `cargo-deny` job above uses. That action does not list cargo-fuzz, so
      # it falls through to cargo-binstall, which finds no prebuilt binary for
      # this tool and compiles it anyway. Naming the version here says what is
      # installed, and //fuzz/README.md names the same one.
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: run
        run: tools/fuzz.sh 60
      - name: findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          # `warn`, not `error`. The step above also fails when the build
          # fails, and a build that never ran a target leaves nothing to
          # upload. That is a real result, and it is already reported by the
          # step that failed.
          if-no-files-found: warn
  # The benchmarks, run. Scheduled rather than a gate on a pull request, for
  # the same reason as the fuzz run above: it needs a separate build and budget.
  #
  # //tools/bench.sh holds the flags, so a local run and this job run the same
  # way. It bounds every benchmark to ten samples over five seconds, which is
  # not a tight budget by Criterion's standards -- the defaults are 100 samples
  # over five seconds each, and //benches declares over sixty ids. What the
  # bound buys is a run that finishes; what it costs is a wider confidence
  # interval, which the ratchet reads and treats as a reason to skip a
  # benchmark rather than as a reason to fail it.
  #
  # The artifact is the whole Criterion output directory: the estimates the
  # ratchet reads, and the HTML report a person reads after the ratchet has
  # said which line moved. It uploads even when the run failed, because a
  # partial run is still the report for the benchmarks that did finish.
  #
  # A note on what this job's numbers are worth. It runs on a GitHub-hosted
  # runner, which is a shared virtual machine with two cores and no control
  # over what else is on the host. Wall clock from such a machine is fine for
  # spotting an order-of-magnitude change and worthless as an absolute figure.
  # That is why //tools/bench-baseline.txt is unseeded: see //benches/README.md
  # for what seeding it would need.
  bench:
    name: benchmarks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A bound, not an estimate, the same way the `fuzz` job treats its own.
    # A cold run builds the whole DataFusion pin at opt-level 3.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # A release build of the DataFusion pin plus six benchmark binaries. The
      # `cargo` and `fuzz` jobs both ran the disk out without this, and ENOSPC
      # during linking surfaces as `ld terminated with signal 7 [Bus error]`.
      - name: free disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          #
          # Two paths are deliberately absent, both of which this step deleted
          # once and had to stop. `/opt/hostedtoolcache` is where the toolchain
          # actions install, and this step runs after them.
          # `/usr/local/lib/node_modules` holds bazelisk, which
          # `/usr/local/bin/bazel` is a symlink into -- removing it left the
          # symlink dangling and `aspect format` failed with `No such file or
          # directory` from inside the CLI, naming neither bazel nor the file.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: benches
      - name: run
        run: tools/bench.sh
      # Always, not `if: failure()`: this is the report, not a finding.
      - name: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: benches/target/criterion/
          # `warn`, not `error`. A run that failed before its first benchmark
          # leaves nothing to upload, and the step that failed has already
          # said so.
          if-no-files-found: warn
      # GitHub-hosted hardware differs from the recorded stable runner, so it
      # validates inventory only. The recorded runner applies numeric baselines.
      - name: ratchet
        run: tools/bench-ratchet.py --record
