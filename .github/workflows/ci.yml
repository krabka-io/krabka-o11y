name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 05:00 UTC: the full container run and the mutation sweep.
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  # The Aspect CLI uploads test logs and BEP through the Actions artifact
  # API, which GitHub gates behind an OIDC token it only mints for jobs
  # holding this. Without it those uploads are skipped and the run says so
  # on every job.
  id-token: write
# Cancel superseded PR runs; let pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Build, test, lint and format. The Aspect CLI narrows each of these to what
  # the change actually touched; `bazel build|test //...` is the equivalent for
  # anyone without the CLI, and is what the nightly job runs.
  ci:
    name: build · test · lint · format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Change detection needs the merge base, not just the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # This job builds and tests every target, and it ran the runner out of
      # disk: the link died as `clang++: linker command failed due to signal`
      # with `zstd: cannot write block: No space left on device` beside it.
      # ENOSPC wears that disguise consistently here -- an LLVM crash report in
      # `coverage`, a Bus error in `cargo`. The runner ships ~25 GB of
      # toolchains no Bazel action touches.
      - name: free disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          # `/opt/hostedtoolcache` is deliberately left alone: this step runs
          # after the toolchain actions, which install into it.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost \
            /usr/local/lib/node_modules
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      # `--severity` defaults to `auto`, which the CLI resolves to `fail` on CI
      # and `info` off it -- so this gates here and only reports locally.
      - name: format
        run: aspect format
      # `aspect lint` narrows to the targets a change touched and annotates the
      # pull request. It reads the `rules_lint_machine` output group, which is
      # why the clippy aspect comes from aspect_rules_lint_rust rather than from
      # @rules_rust -- see //tools/lint/linters.bzl. `bazel test //...` gates on
      # the same aspect through the `*_clippy` targets, for anyone without the
      # CLI. The aspect is named here rather than left to the `build:lint`
      # bazelrc config, which `aspect lint` does not read.
      - name: lint
        run: aspect lint --aspect=//tools/lint:linters.bzl%clippy
      - name: build
        run: aspect build //...
      - name: test
        run: aspect test //...
  # Cargo, gated. Bazel is what the rest of CI builds with, but the two are not
  # the same build, so the cargo path can break with nothing to say so:
  # //bazel/defs.bzl strips the `vendored-protoc` feature and hands `PROTOC` to
  # the build scripts, it applies the workspace lint set by hand because
  # rules_rs does not read Cargo lint tables, and no Bazel action reads
  # //.cargo/config.toml. This job is the only place any of that runs.
  #
  # `--locked` is the second reason to have it. rules_rs resolves from
  # `Cargo.lock` through `crate.from_cargo`, so a manifest edited without a
  # regenerated lockfile breaks the Bazel build too. This reports that in
  # seconds instead of leaving it to a stale-looking build failure.
  #
  # The six container suites are `#[ignore]` under cargo, so they stay in the
  # `docker` jobs below and do not run twice.
  cargo:
    name: cargo
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Debug info is the bulk of what a `cargo test --workspace` writes, and
    # none of it is read here: nothing debugs a CI run, and a backtrace from a
    # failing test needs symbols, which `debug = 0` keeps. Dropping it is what
    # makes the build fit the runner, and it links faster for the same reason.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from `rust-toolchain.toml` rather than being named
      # again here. The action needs the input, so it is read out of the file
      # the rest of the repo already resolves against, the same way
      # //.github/workflows/sync-siblings.yml reads it.
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # A runner ships ~25 GB of toolchains this build never touches, and the
      # link step below ran the disk out without them gone: `cargo test
      # --workspace` links a test binary per target on top of the DataFusion
      # pin, and ENOSPC during linking surfaces as `ld terminated with signal
      # 7 [Bus error]`, which reads like a compiler bug rather than a full
      # disk.
      - name: free disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          # `/opt/hostedtoolcache` is deliberately left alone: this step runs
          # after the toolchain actions, which install into it.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost \
            /usr/local/lib/node_modules
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      # Without this, every run compiles the whole DataFusion pin from source,
      # which is most of the wall clock here. The cache key covers `Cargo.lock`
      # and the `CARGO_*` environment, so the two `CARGO_PROFILE_*` variables
      # below are part of it -- they are set for the job rather than per step
      # so the cached artifacts and the ones this job builds agree.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Two hand-written lists name the crates the sibling repositories hold:
      # `[patch.crates-io]` in Cargo.toml and `SIBLING_MEMBERS` in
      # MODULE.bazel. The script reads the pinned checkouts through `cargo
      # metadata`, so it needs a resolved dependency graph, which a sandboxed
      # Bazel test does not have. sync-siblings.yml runs it on the weekly bump.
      # Running it here catches a hand edit to either list on the pull request
      # that makes it. It comes first because it takes about a second.
      - name: sibling crate lists
        run: tools/check-sibling-members.sh
      - name: test
        run: cargo test --workspace --locked
      # `heap-profiling` swaps the global allocator for jemalloc in each
      # service binary, behind a `cfg`. No Bazel target turns the feature on,
      # so `bazel test //...` never compiles those lines -- and the clippy
      # aspect that gates the rest of the workspace never reads them either.
      # This is the only lint those lines get, so it is clippy rather than
      # `cargo check`: the first compilation of this feature turned up five
      # unused imports that nothing had ever been in a position to report.
      - name: heap-profiling
        run: |
          cargo clippy --locked --features heap-profiling --all-targets \
            -p krabka-metrics \
            -p krabka-metrics-service \
            -p krabka-observability \
            -p krabka-profiles \
            -p krabka-traces \
            -- -D warnings
  # Supply-chain policy, from //deny.toml. That file names the advisories this
  # workspace accepts and the licenses and sources it allows, and until this
  # job existed nothing read it. It had drifted far enough to fail on its first
  # run.
  #
  # `sources` is the half that earns a place on every pull request: it fails on
  # any git or registry source //deny.toml does not name, so a new unpinned
  # remote cannot arrive unnoticed. `advisories` reads the RustSec database,
  # which moves without a change here, so this job can turn red on a pull
  # request that did not touch a dependency. That is what it is for.
  #
  # cargo-deny is pinned to a version, not left to float, so the same commit
  # gets the same result from the tool. The job compiles nothing and holds no
  # cache. It does fetch twice: the git dependencies, because `cargo metadata`
  # reads their manifests, and the RustSec advisory database.
  deny:
    name: cargo-deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories bans licenses sources
  # The repository's own Python tools, checked against synthetic input.
  #
  # //tools/mutants-ratchet.py decides whether the nightly sweep passes, and the
  # sweep runs for hours, so a fault in the ratchet is found a day after the
  # change that caused it and on a job nobody watches. Its `--self-test` builds
  # the shard logs a sweep writes, including the killed and refusing shards that
  # a real run cannot be asked to produce, and checks the verdict for each. It
  # needs no Bazel, no toolchain and about a second, so it runs on every pull
  # request.
  tools:
    name: tool self-tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: tools/mutants-ratchet.py --self-test
      # //tools/bench-ratchet.py reads a Criterion run and decides whether the
      # benchmarks may pass. Its `--self-test` drives those checks against
      # synthetic estimates files, so it needs no benchmark run -- which is the
      # point: the `bench` job below is nightly, and a ratchet developed only
      # against it would be checked once a day.
      - run: tools/bench-ratchet.py --self-test
      # //tools/fuzz-corpus.py writes the seed corpora under //fuzz/corpus, and
      # its `--self-test` checks the varint, zigzag, snappy and protobuf
      # encoders it writes them with against encodings the formats fix. It
      # reads nothing from the repository, so it runs on a bare checkout.
      - run: tools/fuzz-corpus.py --self-test
      # `--check` regenerates the corpora and fails on a seed that is missing
      # or has moved, so a fixture edit that changes what the seeds mine cannot
      # leave a stale corpus behind. It checks the fuzz targets against
      # //fuzz/Cargo.toml as well: a target file with no `[[bin]]` entry is a
      # file cargo-fuzz never builds and never runs, which reads as covered
      # surface and is not.
      - run: tools/fuzz-corpus.py --check
      # //fuzz is a workspace of its own, so it repeats the sibling pins from
      # //Cargo.toml. sync-siblings.yml bumps one copy and knows nothing about
      # the other. This fails on the drift.
      - run: tools/check-fuzz-patch.sh
  # The fuzz targets, compiled. //fuzz is outside the root workspace and
  # outside Bazel, so neither the `ci` job nor the `cargo` job builds it, and a
  # decoder signature that changes leaves a target that no longer compiles with
  # nothing to say so until the next scheduled run.
  #
  # `cargo clippy` rather than `cargo fuzz build`, and that is the whole
  # difference between this job and the `fuzz` job below. A fuzz build is
  # codegen for fourteen binaries on top of the DataFusion pin, instrumented,
  # and it does not fit the budget of a pull request. A clippy run reaches
  # every call the targets make, which is the breakage this job is for, and it
  # is the only lint //fuzz gets: no Bazel target covers this directory, so the
  # clippy aspect that gates the crates never reads it.
  #
  # This job and the `fuzz` job below are the only two in the file that use a
  # nightly toolchain. cargo-fuzz passes `-Z` flags that stable does not take,
  # and //fuzz/README.md says why the channel floats instead of being pinned to
  # a date.
  fuzz-build:
    name: fuzz targets compile
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # A cold run checks the whole DataFusion pin. A warm one takes minutes.
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --all-targets -- -D warnings
  # The benchmarks, compiled. //benches is outside the root workspace and
  # outside Bazel for the reason its Cargo.toml gives -- Criterion is a
  # dev-dependency, and a dev-dependency of a crate under //crates would be
  # linked into every test binary that crate builds, in both build systems --
  # so neither the `ci` job nor the `cargo` job compiles it, and a signature
  # that changes leaves a benchmark that no longer builds with nothing to say
  # so until the next scheduled run.
  #
  # `cargo clippy` rather than `tools/bench.sh`, and that is the whole
  # difference between this job and the `bench` job below. Running the
  # benchmarks is unbounded work that a pull request cannot afford, and the
  # numbers a shared runner produces under a pull request's load would not be
  # worth having if it could. A clippy run reaches every call the benchmarks
  # make, which is the breakage this job is for, and it is the only lint
  # //benches gets: no Bazel target covers this directory, so the clippy aspect
  # that gates the crates never reads it.
  #
  # This job is additive. It does not touch the `ci` or `cargo` jobs, which run
  # concurrently with it on their own runners and build exactly what they built
  # before -- //Cargo.toml and //Cargo.lock are unchanged, and `crates/*` does
  # not match //benches.
  bench-build:
    name: benchmarks compile
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # A cold run checks the whole DataFusion pin. A warm one takes minutes.
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # Stable, from `rust-toolchain.toml`, unlike the fuzz jobs above: nothing
      # here needs nightly, and the benchmarks measure what the pinned
      # toolchain compiles.
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: benches
      - run: cargo clippy --manifest-path benches/Cargo.toml --locked --all-targets -- -D warnings
  # LCOV over the first-party crates. Separate from `ci` because instrumented
  # binaries are a different build, so sharing that job's cache would only
  # evict it.
  coverage:
    name: coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true
      # Instrumented binaries are far larger than a normal build, and this job
      # links every test target in the workspace. It ran the runner's disk to
      # 15 MB free and the link died as `clang++: Bus error (core dumped)`,
      # which reads like an LLVM crash rather than a full disk -- the same
      # disguise ENOSPC wears in the `cargo` job above. The runner ships ~25 GB
      # of toolchains no Bazel action here touches.
      - name: free disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          # `/opt/hostedtoolcache` is deliberately left alone: this step runs
          # after the toolchain actions, which install into it.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost \
            /usr/local/lib/node_modules
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      - run: bazel coverage //crates/...
      # //codecov.yml holds the targets this upload is measured against: a
      # `patch` status that gates, and a `project` status that reports. Read
      # that file before reading a percentage from it -- the coverage run skips
      # the container suites and the timing-sensitive ones, so the number is
      # lower than the truth.
      #
      # `fail_ci_if_error` was false, which made a rejected or lost upload
      # silent: the job stayed green and Codecov reported the previous run's
      # numbers, or none. An upload that does not arrive is a coverage result
      # nobody has, so it fails here.
      - uses: codecov/codecov-action@v7
        with:
          files: bazel-out/_coverage/_coverage_report.dat
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
  # rustdoc for every crate, kept as an artifact. The `ci` job already builds
  # these -- a `rust_doc` per crate is an ordinary target -- so this exists to
  # publish the output, and to keep rendering the whole set even when `aspect
  # build` narrowed to the crates a change touched.
  docs:
    name: docgen
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docs
          repository-cache: true
      - run: bazel build $(bazel query 'kind("rust_doc rule", //crates/...)')
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: bazel-bin/crates/**/*.rustdoc
          if-no-files-found: error
  # Container suites, one runner each.
  #
  # These saturate a runner: each boots a Grafana-stack component and compares
  # against it, so running them together buys little -- the box, not the target
  # granularity, is the limit. One job per suite, so the wall clock is the
  # slowest suite rather than the sum of all of them.
  #
  # `aspect test` does not narrow to impacted targets -- that is an Aspect
  # Workflows feature, not part of the open-source CLI -- so the set is computed
  # here: reverse dependencies of the files a change touched, intersected with
  # the targets tagged `docker`. A scheduled or manual run takes every suite
  # instead, because a green impacted run says "nothing impacted broke", not
  # "the container suites pass".
  docker-select:
    name: select container suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          # rdeps needs the merge base, not just the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docker
          repository-cache: true
      - id: select
        run: |
          set -euo pipefail
          # `except` the scale suites. They are container suites and carry
          # the `docker` tag, so without this they land in this job -- whose
          # budget is 60 minutes for a differential run, not the ingest of ten
          # thousand series. The `scale` job below is theirs.
          all() {
            bazel query 'attr(tags, "docker", //crates/...) except attr(tags, "scale", //crates/...)'
          }

          event="${{ github.event_name }}"
          if [ "${event}" = "schedule" ] || [ "${event}" = "workflow_dispatch" ]; then
            targets="$(all)"
          else
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # No usable base (first push on a branch, force-push): run them all
              # rather than silently skipping.
              targets="$(all)"
            else
              changed="$(git diff --name-only "${base}...HEAD")"

              # Build-wide inputs reach every target, and most are not Bazel
              # targets at all -- `rdeps` takes a target set, and `//:MODULE.bazel`
              # is a source file no rule exports. Treat them as "everything"
              # rather than trying to name them.
              if grep -qE '^(MODULE\.bazel|\.bazelrc|Cargo\.lock|Cargo\.toml|bazel/|tools/)' <<<"${changed}"; then
                targets="$(all)"
              else
                mapfile -t files < <(grep -E '^crates/' <<<"${changed}" | while read -r f; do
                  [ -e "${f}" ] && printf '%s\n' "${f}"
                done)
                if [ "${#files[@]}" -eq 0 ]; then
                  targets=""
                else
                  targets="$(bazel query "attr(tags, 'docker', rdeps(//crates/..., set(${files[*]}))) except attr(tags, 'scale', //crates/...)")"
                fi
              fi
            fi
          fi

          # One matrix entry per target, `name` being the bare suite for the job
          # label -- the full label is too long to read in the checks list.
          # `grep` finding nothing is the empty selection, not an error, and a
          # bare `[ ] && x` would exit under `set -e` whenever the test is false.
          suites="$(
            printf '%s\n' "${targets}" | { grep -E '^//' || true; } |
              jq -R -s -c 'split("\n") | map(select(length > 0)) |
                map({target: ., name: (. | split(":")[1] | sub("_docker_test$"; ""))})'
          )"
          if [ -z "${suites}" ]; then suites='[]'; fi
          echo "suites=${suites}" >>"${GITHUB_OUTPUT}"
          echo "any=$([ "${suites}" = '[]' ] && echo false || echo true)" >>"${GITHUB_OUTPUT}"
          echo "Selected: ${suites}"
  docker:
    name: container · ${{ matrix.suite.name }}
    needs: docker-select
    if: needs.docker-select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One suite failing should not cancel the rest -- the point of the shard
      # is to see every suite's result in one run.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.docker-select.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docker
          repository-cache: true
      # The differential suites point a Grafana-stack container back at a
      # collector running on the host, under the name `host.docker.internal`.
      # The container resolves it through
      # `--add-host=host.docker.internal:host-gateway`; the host has to resolve
      # it too, because the same address is what the test asserts against.
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - run: bazel test --config=docker ${{ matrix.suite.target }}
  # A mutation sweep rebuilds and re-runs a crate's unit tests once per mutant,
  # so it is far too slow to gate a pull request.
  #
  # One job per crate, so each is bounded on its own and reports its own
  # result, and the wall clock is the slowest crate rather than the sum. Two
  # things this shape protects against, both learned the hard way in
  # krabka-broker: a sweep that overruns inside one shared job says nothing
  # about which crate was responsible, and a shard that overruns reports
  # nothing at all rather than reporting a failure -- the totals line
  # (caught + missed + unviable == total) is the only place that shows.
  #
  # The job used to carry `continue-on-error: true`, because survivors are the
  # expected state rather than an exception: `cargo_mutants_test` runs only
  # `#[cfg(test)]` unit tests, so every mutant the `tests/*.rs` suites would
  # have killed is reported as one, and `bazel test` on a mutants target exits
  # non-zero for each of them. That made the exit code useless as a verdict,
  # and nothing else read the run, so both failure modes above were invisible.
  #
  # //tools/mutants-ratchet.py is the verdict now. It reads the shard logs the
  # run leaves in `bazel-testlogs` and fails the job on a totals line that does
  # not add up, on a shard that reported nothing, and on a survivor count above
  # the crate's line in //tools/mutants-baseline.txt. Every crate in that file
  # reads `unseeded` today, so the survivor half is dormant until a nightly run
  # produces a number to check in. The structural half gates from the first run.
  mutants-select:
    name: select mutants targets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      crates: ${{ steps.select.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-mutants
          repository-cache: true
      - id: select
        run: |
          set -euo pipefail
          # Every mutant rebuilds its crate, so the budget follows crate size.
          # promql, observability and traces are 40k lines or more; the rest are
          # a fraction of that.
          crates="$(
            bazel query 'kind("cargo_mutants_test rule", //crates/...)' |
              jq -R -s -c 'split("\n") | map(select(length > 0)) |
                map({target: ., name: (. | split("/")[3] | split(":")[0])}) |
                map(. as $crate | $crate + {minutes: (if (["promql","observability","traces"] | index($crate.name)) then 180 else 60 end)})'
          )"
          echo "crates=${crates}" >>"${GITHUB_OUTPUT}"
          echo "Selected: ${crates}"
  mutants:
    name: mutants · ${{ matrix.crate.name }}
    needs: mutants-select
    runs-on: ubuntu-latest
    # A bound, not an estimate. A crate that cannot finish inside it is saying
    # its shard count is too low, and that is worth being told.
    timeout-minutes: ${{ matrix.crate.minutes }}
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.mutants-select.outputs.crates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-mutants
          repository-cache: true
      # The sweep's exit code says "at least one mutant survived", which is not
      # the question this job asks, so it is dropped and the shard logs are read
      # instead. `|| true` hides a build failure as well, and the ratchet is
      # what reports it: a run that failed before its first shard leaves no
      # shard log, and the step below fails on that.
      - name: sweep
        run: bazel test ${{ matrix.crate.target }} || true
      # The verdict. `--test_output=errors` has already printed each surviving
      # mutant above, so what this adds is the count, the totals-line check and
      # the baseline comparison.
      - name: ratchet
        run: tools/mutants-ratchet.py ${{ matrix.crate.name }}
  # The fuzz targets, run. Scheduled rather than a gate on a pull request, for
  # the same reason as the mutation sweep above: the work is unbounded, and
  # what a pull request can afford is the compile check the `fuzz-build` job
  # does.
  #
  # //tools/fuzz.sh holds the flags, so a local run and this job run the same
  # way. It builds every target once, then gives each one its own bounded
  # budget, so a slow target cannot take the whole run. It copies //fuzz/corpus
  # into a scratch directory first, so a run never edits the checked-in seeds.
  #
  # Sixty seconds a target is a short budget, and most of this job is the
  # build. What that buys every night is the seed corpus re-run, which is the
  # regression half, plus a short exploration from wherever the seeds reach.
  # Nothing carries over between runs: each night starts from the checked-in
  # seeds again. Caching the grown corpus between runs would find more, and it
  # would need a cache policy this job does not have yet.
  #
  # A run that finds nothing is the expected result and says the decoders held
  # for that budget. It is not a proof, and the budget is what a scheduled job
  # can report on rather than a number with a meaning of its own.
  #
  # libFuzzer writes the input for a finding under fuzz/artifacts/<target>/.
  # That upload is the whole report, so it runs even when the step above
  # failed, which is the only case that produces one.
  fuzz:
    name: fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A bound, not an estimate, the same way the `mutants` jobs treat theirs.
    # A cold run links fourteen instrumented binaries on top of the DataFusion
    # pin; a warm one spends most of the time fuzzing.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: rust-src
      # Thirteen instrumented binaries on top of the DataFusion pin, each one
      # statically linked. A runner ships ~25 GB of toolchains this build never
      # touches, and the link step is where a full disk shows up -- as `ld
      # terminated with signal 7 [Bus error]`, which reads like a compiler bug.
      - name: free disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          # `/opt/hostedtoolcache` is deliberately left alone: this step runs
          # after the toolchain actions, which install into it.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost \
            /usr/local/lib/node_modules
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      # `cargo install` rather than taiki-e/install-action, which the
      # `cargo-deny` job above uses. That action does not list cargo-fuzz, so
      # it falls through to cargo-binstall, which finds no prebuilt binary for
      # this tool and compiles it anyway. Naming the version here says what is
      # installed, and //fuzz/README.md names the same one.
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: run
        run: tools/fuzz.sh 60
      - name: findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          # `warn`, not `error`. The step above also fails when the build
          # fails, and a build that never ran a target leaves nothing to
          # upload. That is a real result, and it is already reported by the
          # step that failed.
          if-no-files-found: warn
  # The benchmarks, run. Scheduled rather than a gate on a pull request, for
  # the same reason as the mutation sweep and the fuzz run above: the work is
  # unbounded, and what a pull request can afford is the compile check the
  # `bench-build` job does.
  #
  # //tools/bench.sh holds the flags, so a local run and this job run the same
  # way. It bounds every benchmark to ten samples over five seconds, which is
  # not a tight budget by Criterion's standards -- the defaults are 100 samples
  # over five seconds each, and //benches declares over sixty ids. What the
  # bound buys is a run that finishes; what it costs is a wider confidence
  # interval, which the ratchet reads and treats as a reason to skip a
  # benchmark rather than as a reason to fail it.
  #
  # The artifact is the whole Criterion output directory: the estimates the
  # ratchet reads, and the HTML report a person reads after the ratchet has
  # said which line moved. It uploads even when the run failed, because a
  # partial run is still the report for the benchmarks that did finish.
  #
  # A note on what this job's numbers are worth. It runs on a GitHub-hosted
  # runner, which is a shared virtual machine with two cores and no control
  # over what else is on the host. Wall clock from such a machine is fine for
  # spotting an order-of-magnitude change and worthless as an absolute figure.
  # That is why //tools/bench-baseline.txt is unseeded: see //benches/README.md
  # for what seeding it would need.
  bench:
    name: benchmarks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A bound, not an estimate, the same way the `mutants` and `fuzz` jobs
    # treat theirs. A cold run builds the whole DataFusion pin at opt-level 3.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        run: |
          set -euo pipefail
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # A release build of the DataFusion pin plus six benchmark binaries. The
      # `cargo` and `fuzz` jobs both ran the disk out without this, and ENOSPC
      # during linking surfaces as `ld terminated with signal 7 [Bus error]`.
      - name: free disk
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Language runtimes and SDKs no action in this repository uses.
          # `/opt/hostedtoolcache` is deliberately left alone: this step runs
          # after the toolchain actions, which install into it.
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost \
            /usr/local/lib/node_modules
          # The runner preloads container images for actions that are not used
          # here; the differential suites load their own from pinned tarballs.
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "freed $((after - before)) GiB, ${after} GiB available"
          df -h /
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: benches
      - name: run
        run: tools/bench.sh
      # Always, not `if: failure()`: this is the report, not a finding.
      - name: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: benches/target/criterion/
          # `warn`, not `error`. A run that failed before its first benchmark
          # leaves nothing to upload, and the step that failed has already
          # said so.
          if-no-files-found: warn
      # The verdict. The step above has printed each benchmark's own numbers;
      # what this adds is the inventory check and the baseline comparison.
      - name: ratchet
        run: tools/bench-ratchet.py
  # The scale suites: the block store at the cardinality and volume the design
  # targets, against a real object store.
  #
  # Scheduled, and separate from the `docker` job above even though these are
  # container suites too. A differential suite boots a component and compares a
  # few hundred answers against it. A scale suite writes ten thousand series or
  # a million spans before its first assertion, which is the container job's
  # whole budget. Two tag sets, two jobs, two budgets -- see //.bazelrc, which
  # states the same split.
  #
  # These assert on shape, not on wall clock: how many blocks a prune selected,
  # how many objects a compaction left, whether every row survived. A runner
  # under load makes them slow, not red, which is what lets them be a scheduled
  # gate rather than a scheduled report.
  scale:
    name: scale · ${{ matrix.suite.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A bound, not an estimate, the same way the jobs above treat theirs.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Named rather than queried. There are a handful of these by design,
        # and a matrix computed by a `needs` job would cost a second runner and
        # twenty minutes of Bazel start-up to learn what this list already says.
        # `bazel test --config=scale //crates/...` runs the same set for anyone
        # who would rather not name them.
        suite:
          - name: object_store
            target: //crates/observability:scale_object_store_docker_test
          # The soak. Same tag and same container as the suite above, its own
          # runner because it holds a wall-clock budget of its own and would
          # otherwise spend the other suite's.
          - name: soak
            target: //crates/observability:soak_ingest_query_docker_test
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-scale
          repository-cache: true
      - run: bazel test --config=scale ${{ matrix.suite.target }}
