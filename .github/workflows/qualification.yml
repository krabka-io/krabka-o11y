name: compatibility qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  gates:
    name: qualification · ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ordinary-bazel
            gate: ordinary
            command: bazel test //...
          - id: ordinary-cargo
            gate: ordinary
            command: cargo test --workspace --locked
            allowed_ignored: 26
          - id: ordinary-clippy
            gate: ordinary
            command: cargo clippy --workspace --all-targets --locked -- -D warnings
          - id: ordinary-format
            gate: ordinary
            command: bazel run //tools/format && git diff --exit-code
          - id: oracle-versions
            gate: clients
            command: bazel test --config=docker --flaky_test_attempts=1 //bazel/images:alloy_version_test //bazel/images:alloy_previous_version_test //bazel/images:grafana_version_test //bazel/images:grafana_previous_version_test //bazel/images:loki_version_test //bazel/images:mimir_version_test //bazel/images:prometheus_version_test //bazel/images:prometheus_previous_version_test //bazel/images:pyroscope_version_test //bazel/images:tempo_version_test
          - id: mimir-differential
            gate: differential
            command: bazel test --config=docker --flaky_test_attempts=1 //crates/metrics-service:diff_mimir_docker_test //crates/metrics-service:diff_prometheus_docker_test //crates/metrics-service:diff_prometheus_previous_docker_test
          - id: mimir-grafana
            gate: clients
            command: bazel test --config=docker --flaky_test_attempts=1 //crates/metrics-service:grafana_integration_docker_test //crates/metrics-service:grafana_integration_previous_docker_test
          - id: loki-differential
            gate: differential
            command: bazel test --config=docker --flaky_test_attempts=1 //crates/observability:loki_differential_docker_test
          - id: loki-grafana
            gate: clients
            command: bazel test --config=docker --flaky_test_attempts=1 //crates/observability:grafana_e2e_docker_test //crates/observability:grafana_e2e_previous_docker_test //crates/observability:grafana_integration_docker_test //crates/observability:grafana_integration_previous_docker_test
          - id: tempo-differential
            gate: differential
            command: bazel test --config=docker --flaky_test_attempts=1 //crates/traces:tempo_differential_docker_test
          - id: tempo-grafana
            gate: clients
            command: bazel test --config=docker --flaky_test_attempts=1 //crates/traces:grafana_e2e_docker_test //crates/traces:grafana_e2e_previous_docker_test
          - id: pyroscope-differential
            gate: differential
            command: bazel test --config=docker --flaky_test_attempts=1 //crates/profiles:pyroscope_differential_docker_test
          - id: pyroscope-grafana-previous
            gate: clients
            command: bazel test --config=docker --flaky_test_attempts=1 //crates/profiles:pyroscope_differential_previous_docker_test
          - id: correlations
            gate: clients
            command: bazel test //crates/integration:logs_to_traces_trace_id_test //crates/integration:traces_to_metrics_exemplars_test //crates/integration:traces_to_profiles_span_profiles_test
          - id: client-oracles
            gate: clients
            command: bazel test --config=docker --flaky_test_attempts=1 //crates/integration:alloy_client_docker_test //crates/integration:alloy_client_previous_docker_test //crates/integration:prometheus_client_docker_test //crates/integration:prometheus_client_previous_docker_test
          - id: otlp-contracts
            gate: clients
            command: bazel test //crates/metrics:metrics_test //crates/observability:distributor_otlp_test //crates/traces:traces_test //crates/profiles:profiles_test
          - id: otlp-contracts-current
            gate: clients
            command: tools/otlp-contracts.py --window current
          - id: otlp-contracts-previous
            gate: clients
            command: tools/otlp-contracts.py --window previous
          - id: kubernetes
            gate: kubernetes
            command: bazel run -c opt //bazel/images/krabka:load && tools/kubernetes-qualification.sh krabka-o11y:dev ghcr.io/krabka-io/krabka-o11y:sha-$(git rev-parse --short=12 HEAD^) qualification/evidence/kubernetes
          - id: ha
            gate: ha
            command: bazel test //crates/blockstore:blockstore_test //crates/blockstore:persistence_test //crates/observability:querier_object_store_test //crates/observability:sigterm_drain_test //crates/observability:wal_live_broker_test //crates/profiles:all_drain_order_test //crates/profiles:block_builder_drain_test //crates/profiles:block_builder_object_store_retry_test //crates/traces:all_in_one_drain_order_test //crates/traces:blockbuilder_test //crates/traces:wal_group_rebalance_test
          - id: migration
            gate: migration
            command: bazel run -c opt //bazel/images/krabka:load && tools/release-smoke.sh krabka-o11y:dev ghcr.io/krabka-io/krabka-o11y:sha-$(git rev-parse --short=12 HEAD^) qualification/evidence/persisted-upgrade
          - id: recovery
            gate: recovery
            command: bazel test //crates/blockstore:lifecycle_test //crates/blockstore:object_store_provider_contract_test //crates/blockstore:persistence_test //crates/observability:querier_object_store_test //crates/observability:wal_live_broker_test //crates/profiles:block_builder_object_store_retry_test //crates/profiles:lifecycle_test //crates/traces:block_lifecycle_test
          - id: security
            gate: security
            command: bazel test //crates/metrics:tenant_quota_isolation_test //crates/metrics-service:server_security_test //crates/observability:audit_test //crates/observability:server_security_test //crates/observability:service_security_test //crates/observability:wal_client_security_test //crates/profiles:tenant_resolution_test //crates/promql:tenant_isolation_test //crates/traces:tenant_isolation_test
          - id: scale-object-store
            gate: scale
            command: bazel test --config=scale --flaky_test_attempts=1 //crates/observability:scale_object_store_docker_test
          - id: scale-soak
            gate: scale
            command: bazel test --config=scale --flaky_test_attempts=1 //crates/observability:soak_ingest_query_docker_test
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: compatibility-qualification
          repository-cache: true
      - id: toolchain
        run: |
          channel="$(grep -oP '(?<=^channel = ")[^"]+' rust-toolchain.toml)"
          test -n "${channel}"
          echo "channel=${channel}" >>"${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /usr/local/share/powershell /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - name: host container callback
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: install kind
        if: matrix.gate == 'kubernetes'
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          echo '517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  kind' | sha256sum -c -
          sudo install kind /usr/local/bin/kind
      - name: run and record gate
        env:
          QUALIFICATION_COMMAND: ${{ matrix.command }}
        run: tools/qualification-gate.py --id "${{ matrix.id }}" --gate "${{ matrix.gate }}" --command "${QUALIFICATION_COMMAND}" --allowed-ignored "${{ matrix.allowed_ignored || 0 }}" --output "qualification/evidence/${{ matrix.id }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-21-gate-${{ matrix.id }}-${{ github.sha }}
          path: qualification/evidence/${{ matrix.id }}.json
          if-no-files-found: error

  report:
    name: immutable compatibility report
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: milestone-21-gate-*-${{ github.sha }}
          path: qualification/evidence
          merge-multiple: true
      - name: promote and validate
        run: tools/qualification-report.py --report qualification/milestone-21.json --promote --commit "${GITHUB_SHA}" --evidence-dir qualification/evidence --output qualification/milestone-21-qualified.json --final
      - uses: actions/upload-artifact@v4
        with:
          name: milestone-21-qualification-${{ github.sha }}
          path: qualification/milestone-21-qualified.json
          if-no-files-found: error
