name: buildbuddy smoke

on:
  pull_request:
    paths:
      - .github/workflows/buildbuddy-smoke.yml
      - .github/workflows/benchmark-ratchet.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-runner:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: install BuildBuddy CLI
        run: curl -fsSL https://install.buildbuddy.io | bash
      - name: run remotely
        run: |
          set -euo pipefail
          bb remote \
            --os=linux \
            --arch=amd64 \
            --container_image=docker://docker.io/library/rust@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97 \
            --run_from_commit="${GITHUB_SHA}" \
            --timeout=10m \
            --disable_retry \
            --runner_exec_properties=dockerUser=root \
            --script='rustc --version | grep -F "rustc 1.97.1 " && git rev-parse HEAD'
