name: buildbuddy smoke

on:
  pull_request:
    paths:
      - .github/workflows/buildbuddy-smoke.yml
      - .github/workflows/ci.yml
      - tools/remote-bazel.sh
      - .github/workflows/benchmark-ratchet.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-runner:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - name: Keep temporary files off the size-limited /tmp tmpfs
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@v7
      - name: install BuildBuddy CLI
        run: curl -fsSL https://install.buildbuddy.io | bash
      - name: run remotely
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "${channel}"
          bb remote \
            --os=linux \
            --arch=amd64 \
            --container_image=docker://docker.io/library/rust@sha256:e259494b14672950a909b4c54527e19d29cae6ebf980672114c8bb85e5594e4a \
            --env=PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env=EXPECTED_RUST_CHANNEL="${channel}" \
            --run_from_commit="${GITHUB_SHA}" \
            --timeout=10m \
            --disable_retry \
            --runner_exec_properties=dockerUser=root \
            --script='set -euo pipefail; rustc --version | grep -F "rustc ${EXPECTED_RUST_CHANNEL} "; git rev-parse HEAD'
      - name: build with the CI launcher
        env:
          BUILDBUDDY_REQUIRED: 'true'
        run: tools/remote-bazel.sh build //:linux_amd64
