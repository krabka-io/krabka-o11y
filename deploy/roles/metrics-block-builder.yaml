# krabka-metrics --target=block-builder
#
# Reads the metrics WAL and writes blocks. No data port: `/ready` on the admin
# port is the only probe target, and it reports the `object-store` and
# `wal-consumer` gates.
#
# Metrics has no `compactor` role. Nothing yet merges metric blocks that are
# already in object storage, so the retention sweep that a Mimir compactor
# would run rides inside this role instead -- hence the
# `block-builder-retention-sweep-interval` key below.
#
# The window the sweep applies is per tenant. It is the
# `compactor_blocks_retention_period` limit in the file `runtime-overrides`
# names, which is the same file the distributor and the querier read. With no
# such file, and with no window in it, this role keeps every block forever and
# runs no sweep at all.
#
# `object-store-url` carries no path. //crates/metrics' object-store builder
# drops the prefix a URL names, so blocks go at the bucket root; the querier's
# `manifest-prefix` is what separates them from another signal's.
target: block-builder
admin-listen-addr: 0.0.0.0:9404
bootstrap: broker:9092
object-store-url: s3://krabka-metrics
block-builder-retention-sweep-interval: 5m
