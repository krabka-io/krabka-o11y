# krabka-traces --target=querier
#
# The live-store is a separate production role. Every querier replica reads
# the same hot tier instead of joining a consumer group and splitting it.
target: querier
listen: 0.0.0.0:3200
admin-listen-addr: 0.0.0.0:9404
bootstrap: broker:9092
object-store-url: s3://krabka-traces
querier-live-store-url: http://traces-live-store:3200
