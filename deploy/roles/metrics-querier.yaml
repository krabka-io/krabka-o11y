# krabka-metrics-service --target=querier
#
# The PromQL query API. The querier, the query-frontend and the ruler are roles
# of this binary; `krabka-metrics` is the write path and refuses all three,
# naming this binary when it does.
#
# `wal-bootstrap` is what makes the answer include the last few minutes. It is
# optional to clap and not optional in practice: without it the WAL-head task
# is never spawned and every query silently stops at the newest compacted
# block. That is the shape of loss this milestone is about, so it is set here.
target: querier
listen: 0.0.0.0:9090
admin-listen-addr: 0.0.0.0:9404
object-store-url: s3://krabka-metrics
manifest-prefix: metrics
wal-bootstrap: broker:9092
wal-group-id: krabka-metrics-querier
wal-client-id: krabka-metrics-querier
wal-head-retention: 5m
