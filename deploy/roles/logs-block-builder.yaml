# krabka-observability --target=block-builder
#
# Reads the logs WAL, writes blocks to object storage, and materialises delete
# requests as it goes. Logs has no separate `compactor` role: Loki folds index
# compaction, retention and deletes into the stage that writes durable
# storage, and so does this one. The ops endpoints still answer as Loki's
# compactor, because that is the name a Loki runbook looks for.
#
# `index-prefix` and `object-store-url` are both refused-at-startup required
# for this role. `data-root` holds the local manifest and the delete-request
# store, so it needs real storage, not a scratch directory that a restart
# empties.
target: block-builder
listen-addr: 0.0.0.0:3100
admin-listen-addr: 0.0.0.0:9404
wal-bootstrap-server: broker:9092
object-store-url: s3://krabka-logs
index-prefix: logs
data-root: /var/lib/krabka
