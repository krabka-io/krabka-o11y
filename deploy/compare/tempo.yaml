# Tempo 3.1.0; native monolith bypasses Kafka. API acknowledgements only.
# Use -config.expand-env=true. Cold reads require actual object GET evidence.
target: all
multitenancy_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: s3
    blocklist_poll: 2s
    s3:
      bucket: tempo
      endpoint: minio:9000
      access_key: ${MINIO_ROOT_USER}
      secret_key: ${MINIO_ROOT_PASSWORD}
      insecure: true
      forcepathstyle: true
    wal:
      path: /data/tempo/wal
live_store:
  shutdown_marker_dir: /data/tempo/shutdown-marker
  wal:
    path: /data/tempo/live-store
  flush_check_period: 2s
  max_trace_idle: 2s
  max_trace_live: 10s
  max_block_duration: 10s
  complete_block_timeout: 30s
query_frontend:
  query_end_cutoff: 0s
  search:
    query_backend_after: 0s
    max_result_limit: 1000
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 1000000000
      burst_size_bytes: 1000000000
      max_traces_per_user: 0
    global:
      max_bytes_per_trace: 0
usage_report:
  reporting_enabled: false
