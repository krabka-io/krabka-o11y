# Loki 3.7.8; native RF1 API comparison. Use -config.expand-env=true.
target: all
auth_enabled: true
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: minio:9000
      bucketnames: loki
      access_key_id: ${MINIO_ROOT_USER}
      secret_access_key: ${MINIO_ROOT_PASSWORD}
      insecure: true
      s3forcepathstyle: true
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: /data/loki/tsdb-index
    cache_location: /data/loki/tsdb-cache
ingester:
  wal:
    enabled: true
    dir: /data/loki/wal
  flush_check_period: 2s
  chunk_idle_period: 5s
  max_chunk_age: 30s
limits_config:
  allow_structured_metadata: true
  reject_old_samples: false
  ingestion_rate_mb: 1000000
  ingestion_burst_size_mb: 1000000
  per_stream_rate_limit: 1GB
  per_stream_rate_limit_burst: 1GB
  max_streams_per_user: 0
  max_global_streams_per_user: 0
  max_query_series: 1000000
analytics:
  reporting_enabled: false
