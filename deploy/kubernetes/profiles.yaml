metadata:
  name: profiles-querier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: profiles-querier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profiles-querier
    spec:
      # In-flight queries -- in principle. This role does not exit on
      # SIGTERM at all, so in practice every stop ends in SIGKILL at the end
      # of this period. See the gaps section of deploy/README.md.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The topic contract, re-checked on every pod start. `provision_topics`
        # creates what is missing, then describes every topic and fails when one
        # does not meet the contract -- so a role cannot come up against a
        # broker whose WAL topic is compacted, or absent. No service binary
