          securityContext: *pod-security
          containers:
            - name: role
              image: ghcr.io/krabka-io/krabka-o11y
              command: [krabka-traces]
              args: [--config.file=/etc/krabka/traces-query-frontend.yaml]
              envFrom: *object-store-env
              ports:
                - {name: http, containerPort: 3200}
                - {name: admin, containerPort: 9404}
              startupProbe: *http-startup
              readinessProbe: *http-ready
              livenessProbe: *admin-live
              securityContext: *container-security
              volumeMounts: *role-mounts
          volumes: *role-volumes
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: traces-compactor
    spec:
      replicas: 1
      selector:
        matchLabels: {app.kubernetes.io/name: traces-compactor}
      template:
        metadata:
          labels: {app.kubernetes.io/name: traces-compactor}
        spec:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
          securityContext: *pod-security
          containers:
            - name: role
              image: ghcr.io/krabka-io/krabka-o11y
              command: [krabka-traces]
              args: [--config.file=/etc/krabka/traces-compactor.yaml]
              envFrom: *object-store-env
              ports: [{name: admin, containerPort: 9404}]
              startupProbe: *admin-startup
              readinessProbe: *admin-ready
              livenessProbe: *admin-live
              securityContext: *container-security
              volumeMounts: *role-mounts
          volumes: *role-volumes
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: traces-metrics-generator
    spec:
      replicas: 1
      selector:
        matchLabels: {app.kubernetes.io/name: traces-metrics-generator}
      template:
        metadata:
          labels: {app.kubernetes.io/name: traces-metrics-generator}
        spec:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 60
          securityContext: *pod-security
          initContainers: *topic-contract
          containers:
            - name: role
              image: ghcr.io/krabka-io/krabka-o11y
              command: [krabka-traces]
              args: [--config.file=/etc/krabka/traces-metrics-generator.yaml]
              ports: [{name: admin, containerPort: 9404}]
              startupProbe: *admin-startup
              readinessProbe: *admin-ready
              livenessProbe: *admin-live
              securityContext: *container-security
              volumeMounts: *role-mounts
          volumes: *role-volumes
  - apiVersion: v1
    kind: Service
    metadata:
      name: profiles-query-frontend
    spec:
      selector: {app.kubernetes.io/name: profiles-query-frontend}
      ports: [{name: http, port: 4040, targetPort: http}]
