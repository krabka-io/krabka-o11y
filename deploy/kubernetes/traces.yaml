# OTLP, Jaeger and Zipkin trace ingest, block building, and TraceQL search.
#
# Read the probe comments before copying this file. `krabka-traces` registers
# no readiness gates and serves no `/ready` on its admin port, so none of these
# roles can report whether it is able to answer -- only whether its socket is
# open. That is a gap in the binary, not in the manifest.
apiVersion: v1
kind: Service
metadata:
  name: traces-distributor
spec:
  selector:
    app.kubernetes.io/name: traces-distributor
  ports:
    - {name: http, port: 3200, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traces-distributor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traces-distributor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traces-distributor
    spec:
      # In-flight pushes, already WAL-acknowledged.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The topic contract, re-applied on every pod start. `provision_topics`
        # creates what is missing, then describes every topic and fails when one
        # does not meet the contract -- so a role cannot come up against a
        # broker whose WAL topic is compacted, or absent. The service binary
        # checks too, with `require_topics`, but it only checks: creating the
        # six topics is this container's job, and nothing else in the pod can
        # do it.
        - name: topic-contract
          image: ghcr.io/krabka-io/krabka-o11y
          command: [krabka-o11y-bootstrap]
          args:
            - --bootstrap=broker:9092
            - --partitions=1
            - --state-partitions=1
            - --replicas=1
            - --retention-ms=900000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: role
          image: ghcr.io/krabka-io/krabka-o11y
          command: [krabka-traces]
          args: [--config.file=/etc/krabka/traces-distributor.yaml]
          envFrom:
            - secretRef: {name: krabka-object-store}
            - configMapRef: {name: krabka-object-store-endpoint}
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: jaeger-grpc, containerPort: 14250}
            - {name: jaeger-http, containerPort: 14268}
            - {name: zipkin, containerPort: 9411}
            - {name: admin, containerPort: 9404}
          # A socket check, not `/ready`. `krabka-traces` merges only the
          # metrics router into its admin port, and the `/ready` its data-port
          # roles serve is a constant `"ready"` with no gates behind it. An
          # httpGet here would report a readiness this binary does not measure,
          # which is worse than reporting only that the port is open.
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 60
          # The admin port, not :3200. This role's data ports are OTLP,
          # Jaeger and Zipkin ingest routers with no HTTP surface of their own,
          # so `/ready` -- and the `wal-broker` gate it reports -- is on :9404.
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 5
          # Liveness is a socket check, never `/ready`. Nothing here serves a
          # liveness route, and pointing liveness at readiness restarts a role
          # for being slow to load an index -- which throws away what it had
          # loaded and makes it slower.
          livenessProbe:
            tcpSocket: {port: admin}
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: roles, mountPath: /etc/krabka, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /var/lib/krabka}
      volumes:
        - name: roles
          configMap: {name: krabka-roles}
        - name: tmp
          emptyDir: {}
        # The working directory. Nothing durable is kept here for this
        # role -- the WAL is in the broker, the blocks are in the object
        # store -- so an emptyDir is the honest choice.
        - name: state
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traces-block-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traces-block-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traces-block-builder
    spec:
      # This role checks for cancellation only at the top of its next loop
      # iteration, so a drain waits up to one `block-builder-window` before
      # the final flush even starts. Five seconds of window, then a flush and
      # an offset commit against the object store.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The topic contract, re-applied on every pod start. `provision_topics`
        # creates what is missing, then describes every topic and fails when one
        # does not meet the contract -- so a role cannot come up against a
        # broker whose WAL topic is compacted, or absent. The service binary
        # checks too, with `require_topics`, but it only checks: creating the
        # six topics is this container's job, and nothing else in the pod can
        # do it.
        - name: topic-contract
          image: ghcr.io/krabka-io/krabka-o11y
          command: [krabka-o11y-bootstrap]
          args:
            - --bootstrap=broker:9092
            - --partitions=1
            - --state-partitions=1
            - --replicas=1
            - --retention-ms=900000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: role
          image: ghcr.io/krabka-io/krabka-o11y
          command: [krabka-traces]
          args: [--config.file=/etc/krabka/traces-block-builder.yaml]
          envFrom:
            - secretRef: {name: krabka-object-store}
            - configMapRef: {name: krabka-object-store-endpoint}
          ports:
            - {name: admin, containerPort: 9404}
          # A socket check, not `/ready`. `krabka-traces` merges only the
          # metrics router into its admin port, and the `/ready` its data-port
          # roles serve is a constant `"ready"` with no gates behind it. An
          # httpGet here would report a readiness this binary does not measure,
          # which is worse than reporting only that the port is open.
          startupProbe:
            tcpSocket: {port: admin}
            periodSeconds: 5
            failureThreshold: 60
          # No data port at all, so :9404 is the only place its `wal-consumer`,
          # `object-store` and `trace-index` gates can be asked.
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: admin}
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: roles, mountPath: /etc/krabka, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /var/lib/krabka}
      volumes:
        - name: roles
          configMap: {name: krabka-roles}
        - name: tmp
          emptyDir: {}
        # The working directory. Nothing durable is kept here for this
        # role -- the WAL is in the broker, the blocks are in the object
        # store -- so an emptyDir is the honest choice.
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: traces-querier
spec:
  selector:
    app.kubernetes.io/name: traces-querier
  ports:
    - {name: http, port: 3200, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traces-querier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traces-querier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traces-querier
    spec:
      # In-flight searches.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The topic contract, re-applied on every pod start. `provision_topics`
        # creates what is missing, then describes every topic and fails when one
        # does not meet the contract -- so a role cannot come up against a
        # broker whose WAL topic is compacted, or absent. The service binary
        # checks too, with `require_topics`, but it only checks: creating the
        # six topics is this container's job, and nothing else in the pod can
        # do it.
        - name: topic-contract
          image: ghcr.io/krabka-io/krabka-o11y
          command: [krabka-o11y-bootstrap]
          args:
            - --bootstrap=broker:9092
            - --partitions=1
            - --state-partitions=1
            - --replicas=1
            - --retention-ms=900000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: role
          image: ghcr.io/krabka-io/krabka-o11y
          command: [krabka-traces]
          args: [--config.file=/etc/krabka/traces-querier.yaml]
          envFrom:
            - secretRef: {name: krabka-object-store}
            - configMapRef: {name: krabka-object-store-endpoint}
          ports:
            - {name: http, containerPort: 3200}
            - {name: admin, containerPort: 9404}
          # A socket check, not `/ready`. `krabka-traces` merges only the
          # metrics router into its admin port, and the `/ready` its data-port
          # roles serve is a constant `"ready"` with no gates behind it. An
          # httpGet here would report a readiness this binary does not measure,
          # which is worse than reporting only that the port is open.
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 60
          # The data port, because that is the port the query-frontend
          # probes to decide its fan-out. It reports `object-store` and
          # `trace-index`, and `live-store` when the embedded live tier is on.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          # Liveness is a socket check, never `/ready`. Nothing here serves a
          # liveness route, and pointing liveness at readiness restarts a role
          # for being slow to load an index -- which throws away what it had
          # loaded and makes it slower.
          livenessProbe:
            tcpSocket: {port: admin}
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: roles, mountPath: /etc/krabka, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /var/lib/krabka}
      volumes:
        - name: roles
          configMap: {name: krabka-roles}
        - name: tmp
          emptyDir: {}
        # The working directory. Nothing durable is kept here for this
        # role -- the WAL is in the broker, the blocks are in the object
        # store -- so an emptyDir is the honest choice.
        - name: state
          emptyDir: {}
