# Fuzz targets for the unauthenticated wire decoders and the query-language
# parsers.
#
# This is a workspace of its own, not a member of the root one. cargo-fuzz
# needs a nightly toolchain and `-Z` flags; the repository pins stable in
# //rust-toolchain.toml and Bazel builds through rules_rs against a pinned
# toolchain. Keeping the fuzz crate outside the root workspace is what lets
# `cargo build --workspace` and `bazel build //...` stay on stable and stay
# unaware that this directory exists. //Cargo.toml names it in `exclude` as
# well, so the separation is stated in both places rather than resting on the
# `crates/*` glob happening not to match.
#
# The cost of that separation is the `[patch.crates-io]` table below. Cargo
# reads `[patch]` only from the workspace root it is building, so the sibling
# revisions have to be repeated here. //tools/check-fuzz-patch.sh diffs the two
# tables and fails when they drift; the `tools` job on every pull request runs
# it.
[package]
name = "krabka-o11y-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# The workspace MSRV, repeated. Nothing here compiles on that toolchain -- the
# targets need nightly. It is stated because Cargo's resolver reads it, and
# with it the lockfile beside this file picks the same dependency versions as
# //Cargo.lock rather than the newest ones the registry offers.
rust-version = "1.98.1"
license = "Apache-2.0"
authors = ["The Krabka Authors"]

[package.metadata]
cargo-fuzz = true

# There is no `[lints]` table here, and //Cargo.toml's does not reach across a
# workspace boundary. The `fuzz-build` job runs `cargo clippy -- -D warnings`
# over this crate, which is Clippy's default groups rather than the workspace's
# `pedantic`. Two of the workspace's lines cannot apply: `unsafe_code =
# "forbid"` rejects the `#[unsafe(no_mangle)]` entry point that `fuzz_target!`
# expands to, and `pedantic` asks for kebab-case binary names, which every
# cargo-fuzz corpus path and every fuzz target file here spells with
# underscores. Neither is worth an `#[allow]`, and //CLAUDE.md rules those out.

[workspace]

# The version pins repeat //Cargo.toml's `[workspace.dependencies]` rather than
# inheriting it: a workspace does not lend its table to another workspace. Keep
# `prost` and `snap` on the same lines as the root table, because the models in
# `src/` encode messages the decoders under test then read back.
[dependencies]
arbitrary = { version = "1", features = ["derive"] }
krabka-logql = { path = "../crates/logql" }
krabka-metrics = { path = "../crates/metrics" }
krabka-pprof = { path = "../crates/pprof" }
krabka-promql = { path = "../crates/promql" }
krabka-traceql = { path = "../crates/traceql" }
krabka-traces = { path = "../crates/traces" }
krabka-units = { version = "0.5.0" }
libfuzzer-sys = "0.4"
# The features //crates/traces/Cargo.toml takes, so `TracesData` here is the
# same type `decode_otlp` takes there.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "gen-tonic-messages", "trace"] }
prost = "0.14"
snap = "1"

# Each target is one `[[bin]]`. `test`, `doc` and `bench` are off because a
# fuzz target is a libFuzzer entry point rather than a Rust test binary, and
# `cargo test` on this crate would otherwise try to run it as one.

[[bin]]
name = "jaeger_compact_thrift"
path = "fuzz_targets/jaeger_compact_thrift.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jaeger_compact_structured"
path = "fuzz_targets/jaeger_compact_structured.rs"
