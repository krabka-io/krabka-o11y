# Sibling repositories, pinned by revision. These crates are declared
# against crates.io above and in the member manifests; the patch below is
# the single place a sibling revision is bumped.
#
# Every sibling crate in the dependency graph is listed, not only the ones
# this repo names directly: cargo ignores a dependency's own patch table,
# so a crate reached through another sibling crate would otherwise come
# from the registry while its git twin is also in the graph. A sibling
# crate that nothing here uses needs no entry.
#
# tools/check-sibling-members.sh checks this table and the SIBLING_MEMBERS
# dict in MODULE.bazel against the siblings at the pinned revisions.
