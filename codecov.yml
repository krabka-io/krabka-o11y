# Codecov configuration for krabka-o11y.
#
# The `coverage` job in //.github/workflows/ci.yml runs `bazel coverage
# //crates/...` nightly or on manual dispatch and uploads the merged LCOV
# file. Coverage statuses are informational because PRs do not upload reports.
#
# Read the reported percentage with one thing in mind. //.bazelrc sets
#
#     coverage --test_tag_filters=-docker,-timing-sensitive
#
# so the coverage run skips two sets of tests that `bazel test` runs. The six
# container suites are skipped because they need a Docker daemon and several
# hundred megabytes of images. `//crates/observability:compactor_test` is
# skipped because it asserts on wall-clock behaviour, and the instrumentation
# makes it miss its own deadlines. That exclusion is new: M1 added the first
# `timing-sensitive` target, and before that the filter matched nothing.
#
# The code those suites cover is still in the report, and every line of it
# reads as uncovered. The number therefore understates what the workspace
# actually tests, and it understates it by an amount nobody has measured. A
# `project` target set against it would be a target set against an unknown, so
# `project` stays informational here until somebody measures the gap.

codecov:
  # A report from a failed build measures a build that did not finish.
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "50...90"
  status:
    # Informational, and deliberately so. See the note above: the reported
    # percentage is lower than the real one, and by an unknown amount. This
    # status reports the direction of travel and fails nothing. Give it a
    # target once the gap is measured.
    project:
      default:
        target: auto
        informational: true

    # Coverage runs nightly or on manual dispatch, so PRs have no patch report.
    patch: off

# Integration test sources are compiled into the instrumented binaries, so they
# appear in the report as ordinary files. Counting them would let a change that
# adds a large test file and no test of its new code pass the `patch` target on
# the test file alone.
ignore:
  - "crates/*/tests/**"
  # These supervisors own live broker/object-store loops. They are exercised
  # by the Kubernetes qualification rather than the unit-only Bazel coverage
  # run; counting their transport plumbing would make the patch gate measure a
  # test topology that the coverage job cannot execute.
  - "crates/metrics-service/src/run_fenced_ruler_evaluation_loop.rs"
  - "crates/metrics-service/src/buffered_ruler_outputs.rs"
  - "crates/metrics-service/src/ruler_lease.rs"
  - "crates/metrics-service/src/bin/krabka-metrics-service/run_ruler.rs"
  - "crates/metrics/src/bin/krabka-metrics/run_block_builder.rs"
  - "crates/profiles/src/bin/krabka-profiles/run_symbolizer.rs"

comment:
  layout: "condensed_header, diff, files"
  # Post the comment even when the numbers did not move. A pull request with no
  # comment reads as an upload that did not arrive.
  require_changes: false
