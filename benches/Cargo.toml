[package]
name = "krabka-o11y-benches"
version = "0.0.0"
publish = false
edition = "2024"
# The workspace MSRV, repeated. Cargo's resolver reads it, and with it the
# lockfile beside this file picks the same dependency versions as //Cargo.lock
# rather than the newest ones the registry offers.
rust-version = "1.98.1"
license = "Apache-2.0"
authors = ["The Krabka Authors"]

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The fixture builders in `src/` are a library rather than a module each bench
# includes, so that a bench file holds the measurement and nothing else, and so
# that the generators have one definition to keep honest. The version pins
# repeat //Cargo.toml's `[workspace.dependencies]`, because a workspace does
# not lend its table to another workspace.
[dependencies]
arrow = { version = "59", default-features = false, features = ["ipc"] }
# The log scan benchmark drives a `SessionContext`, which is DataFusion's own
# type rather than anything //crates/blockstore re-exports. Pinned to the same
# git revision //Cargo.toml pins, for the same reason every other version here
# repeats the workspace's: a second workspace does not inherit the first one's
# table.
datafusion = { git = "https://github.com/apache/datafusion", rev = "0062b4b409a1c556c84746b840fd65e1cdd151c9", version = "54" }
krabka-blockstore = { path = "../crates/blockstore" }
# `WalRecord` is `krabka-metrics`' type, not one //crates/promql re-exports,
# and the WAL-head benchmark applies records rather than pushing samples.
krabka-metrics = { path = "../crates/metrics" }
krabka-pprof = { path = "../crates/pprof" }
krabka-promql = { path = "../crates/promql" }
krabka-traceql = { path = "../crates/traceql" }
krabka-units = { version = "0.5.0" }
object_store = { version = "0.13", features = ["aws", "azure", "gcp"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# `async_tokio` so a bench body can be an `async` block driven by a runtime
# Criterion enters once per iteration rather than by a hand-rolled `block_on`
# inside `iter()`, which would time runtime construction as part of the
# measurement.
criterion = { version = "0.7", features = ["async_tokio", "html_reports"] }

# Debug info is the bulk of what a release-profile build of the DataFusion pin
# writes, and nothing here reads it: a Criterion run reports wall clock, and a
# profile of a bench is taken by rebuilding it with symbols on purpose. Off, so
# the build fits a runner's disk -- the `cargo` job sets the same thing through
# the environment for the same reason.
[profile.bench]
debug = false

# Each benchmark is one `[[bench]]`, and its name is also the name of the
# Criterion group inside it. That is what makes a benchmark id begin with its
# target's name, which is how //tools/bench-ratchet.py's `--bench` narrows a
# partial run to the ids that run belongs to.
[[bench]]
name = "blockstore_write"
harness = false

[[bench]]
name = "blockstore_read"
harness = false

[[bench]]
name = "log_object_store_scan"
harness = false

[[bench]]
name = "index_prune"
harness = false

[[bench]]
name = "promql_range"
harness = false

[[bench]]
name = "wal_head_apply"
harness = false

[[bench]]
name = "traceql_filter"
harness = false

[[bench]]
name = "pprof_merge"
harness = false

[patch.crates-io]
# Keep the RPC error small for async handlers under Rust 1.98.
connectrpc-axum = { git = "https://github.com/krabka-io/connectrpc-axum", rev = "848a3de54d7d75b5e66370990c47745f9bf585ef" }
