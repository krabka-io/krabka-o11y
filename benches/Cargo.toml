# Criterion benchmarks for the hot paths: block write and read, index pruning,
# PromQL range evaluation, TraceQL span filtering, and pprof tree merge.
#
# This is a workspace of its own, not a member of the root one, for the same
# reason //fuzz is: what it needs must not reach the builds that gate a pull
# request. Criterion is a dev-dependency wherever it is declared, and Cargo
# hands a crate's dev-dependencies to its tests as well as to its benches --
# so `criterion` in //crates/blockstore/Cargo.toml would be linked into every
# test binary that crate builds, under Cargo *and* under Bazel, where
# `crate_tests` reads the same table through `all_crate_deps(normal_dev =
# True)`. `cargo test --workspace` and `bazel test //...` would both get
# slower to buy nothing they run.
#
# Kept out here instead, the benchmarks are invisible to both. `crates/*` does
# not match this directory, `crate.from_cargo` in //MODULE.bazel resolves
# //Cargo.lock rather than the lockfile beside this file, and `cargo metadata`
# on the root workspace reports the same ten members it did before. No BUILD
# file mentions benchmarks and none needs to: //bazel/defs.bzl has no macro
# for a `[[bench]]`, and adding one would put the cost back where this
# separation takes it out of.
#
# What runs them is //tools/bench.sh, from the `bench` job in
# //.github/workflows/ci.yml -- a scheduled job, like the mutation sweep and
# the fuzz run, for the same reason: the work is unbounded and a pull request
# cannot afford it. The pull-request half is `bench-build`, which compiles the
# targets and runs nothing, exactly as `fuzz-build` does for //fuzz.
#
# The cost of the separation is the `[patch.crates-io]` table below. Cargo
# reads `[patch]` only from the workspace root it is building, so the sibling
# revisions have to be repeated here. //tools/check-fuzz-patch.sh checks this
# copy and //fuzz's against //Cargo.toml, and the `tools` job on every pull
# request runs it.
[package]
name = "krabka-o11y-benches"
version = "0.0.0"
publish = false
edition = "2024"
# The workspace MSRV, repeated. Cargo's resolver reads it, and with it the
# lockfile beside this file picks the same dependency versions as //Cargo.lock
# rather than the newest ones the registry offers.
rust-version = "1.98.1"
license = "Apache-2.0"
authors = ["The Krabka Authors"]

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The fixture builders in `src/` are a library rather than a module each bench
# includes, so that a bench file holds the measurement and nothing else, and so
# that the generators have one definition to keep honest. The version pins
# repeat //Cargo.toml's `[workspace.dependencies]`, because a workspace does
# not lend its table to another workspace.
[dependencies]
arrow = { version = "60", default-features = false, features = ["ipc"] }
# The log scan benchmark drives a `SessionContext`, which is DataFusion's own
# type rather than anything //crates/blockstore re-exports. Pinned to the same
# git revision //Cargo.toml pins, for the same reason every other version here
# repeats the workspace's: a second workspace does not inherit the first one's
# table.
datafusion = { git = "https://github.com/apache/datafusion", rev = "532cd0376448c94b6a87d03fe2072d5094764704", version = "55" }
krabka-blockstore = { path = "../crates/blockstore" }
# `WalRecord` is `krabka-metrics`' type, not one //crates/promql re-exports,
# and the WAL-head benchmark applies records rather than pushing samples.
krabka-metrics = { path = "../crates/metrics" }
krabka-logql = { path = "../crates/logql" }
krabka-observability = { path = "../crates/observability" }
krabka-pprof = { path = "../crates/pprof" }
krabka-promql = { path = "../crates/promql" }
krabka-traceql = { path = "../crates/traceql" }
krabka-units = { version = "0.6.0" }
object_store = { version = "0.14", features = ["aws", "azure", "gcp"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert2 = "0.4"
# `async_tokio` so a bench body can be an `async` block driven by a runtime
# Criterion enters once per iteration rather than by a hand-rolled `block_on`
# inside `iter()`, which would time runtime construction as part of the
# measurement.
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }

# Debug info is the bulk of what a release-profile build of the DataFusion pin
# writes, and nothing here reads it: a Criterion run reports wall clock, and a
# profile of a bench is taken by rebuilding it with symbols on purpose. Off, so
# the build fits a runner's disk -- the `cargo` job sets the same thing through
# the environment for the same reason.
[profile.bench]
debug = false

# Each benchmark is one `[[bench]]`, and its name is also the name of the
# Criterion group inside it. That is what makes a benchmark id begin with its
# target's name, which is how //tools/bench-ratchet.py's `--bench` narrows a
# partial run to the ids that run belongs to.
[[bench]]
name = "blockstore_write"
harness = false

[[bench]]
name = "blockstore_read"
harness = false

[[bench]]
name = "log_object_store_scan"
harness = false

[[bench]]
name = "index_prune"
harness = false

[[bench]]
name = "index_matchers"
harness = false

[[bench]]
name = "log_index_matchers"
harness = false

[[bench]]
name = "promql_range"
harness = false

[[bench]]
name = "wal_head_apply"
harness = false

[[bench]]
name = "traceql_filter"
harness = false

[[bench]]
name = "pprof_merge"
harness = false

[[bench]]
name = "profile_query"
harness = false

[[bench]]
name = "log_stream_query"
harness = false

[patch.crates-io]
# Keep the RPC error small for async handlers under Rust 1.98.
# `krabka-broker` depends on `krabka-schema-serde`, so the git dependency
# above needs it patched here too. Resolved from krabka-schema-registry, the
# same source the broker itself patches, so the broker gets the copy it was
# built against.
