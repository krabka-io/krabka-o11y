# The edition rustfmt formats for, and the style rules of that edition.
#
# `cargo fmt` passes `--edition` from Cargo.toml, so it never needed stating.
# rustfmt invoked directly -- as //tools/format does -- defaults to 2015 instead,
# which rejects `async move` outright and sorts `use` lists differently. Stating
# it here makes the formatting a property of the repository rather than of how
# rustfmt happened to be launched.
edition = "2024"
style_edition = "2024"

format_code_in_doc_comments = true
# Import layout, previously kept as manual discipline, now enforced. Both options
# are still nightly-gated, which is fine: CI formats with `cargo +nightly fmt`
# (already required for `format_code_in_doc_comments` above). Plain stable
# `cargo fmt` silently skips them.
group_imports = "StdExternalCrate"
imports_granularity = "Crate"
