[package]
name = "krabka-integration"
# Not published: it exists only to hold the workspace's cross-signal suites,
# and it depends on crates that are themselves unpublishable.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Cross-signal integration suites for Krabka observability"
repository = "https://github.com/krabka-io/krabka-o11y"
homepage = "https://github.com/krabka-io/krabka-o11y"
documentation = "https://krabka-io.github.io/krabka-o11y/krabka_integration/"
readme = "../../README.md"
keywords = ["observability", "integration", "testing", "krabka"]
categories = ["development-tools::testing"]

[lints]
workspace = true

# No `[dependencies]`. The library is documentation, not code: everything this
# crate builds lives under `tests/`, so every signal crate it drives is a
# dev-dependency. That keeps the "depends on more than one signal" licence
# scoped to test binaries, where it belongs.

[dev-dependencies]
arc-swap = { workspace = true }
assert2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
bytes = { workspace = true }
# `backup_restore` reads the Prometheus TSDB block fixture of krabka-metrics,
# whose expected samples are gzip-compressed.
flate2 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
krabka-blockstore = { path = "../blockstore", version = "0.4.0" }
# `backup_restore` boots a real broker in-process, takes a consistent cut of
# it and of every signal's object store, and restores both into an empty
# deployment. Test-only, hence dev-dependencies.
krabka-broker = { version = "0.7.0" }
krabka-client-consumer = { version = "0.5.0" }
krabka-client-producer = { version = "0.5.0" }
krabka-logql = { path = "../logql", version = "0.4.0" }
krabka-metrics = { path = "../metrics", version = "0.4.0" }
krabka-metrics-service = { path = "../metrics-service", version = "0.4.0" }
krabka-observability = { path = "../observability", version = "0.4.0" }
krabka-pprof = { path = "../pprof", version = "0.4.0" }
krabka-profiles = { path = "../profiles", version = "0.4.0" }
krabka-promql = { path = "../promql", version = "0.4.0" }
krabka-traceql = { path = "../traceql", version = "0.4.0" }
krabka-traces = { path = "../traces", version = "0.4.0" }
krabka-units = { workspace = true }
num-traits = { workspace = true }
object_store = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
url = { workspace = true }

# The operating-envelope soak needs a MinIO container and a wall-clock budget,
# so it stays out of a plain `cargo test`. The `#[ignore]` on its one test
# keeps it out as well; this line keeps its build out of `cargo test`, which
# would otherwise link a binary it never runs. It stays reachable by name:
#
#     cargo test -p krabka-integration --test soak_envelope -- --ignored
#
# Under Bazel the same separation is the `scale` tag in BUILD.bazel, which
# //.bazelrc excludes from `bazel test //...` and selects with `--config=scale`.
[[test]]
name = "soak_envelope"
test = false
