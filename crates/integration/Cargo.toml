[package]
name = "krabka-integration"
# Not published: it exists only to hold the workspace's cross-signal suites,
# and it depends on crates that are themselves unpublishable.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Cross-signal integration suites for Krabka observability"
repository = "https://github.com/krabka-io/krabka-o11y"
homepage = "https://github.com/krabka-io/krabka-o11y"
documentation = "https://docs.rs/krabka-integration"
readme = "../../README.md"
keywords = ["observability", "integration", "testing", "krabka"]
categories = ["development-tools::testing"]

[lints]
workspace = true

# No `[dependencies]`. The library is documentation, not code: everything this
# crate builds lives under `tests/`, so every signal crate it drives is a
# dev-dependency. That keeps the "depends on more than one signal" licence
# scoped to test binaries, where it belongs.

[dev-dependencies]
assert2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
bytes = { workspace = true }
hex = { workspace = true }
krabka-blockstore = { path = "../blockstore", version = "0.4.0" }
krabka-metrics = { path = "../metrics", version = "0.4.0" }
krabka-observability = { path = "../observability", version = "0.4.0" }
krabka-profiles = { path = "../profiles", version = "0.4.0" }
krabka-promql = { path = "../promql", version = "0.4.0" }
krabka-traces = { path = "../traces", version = "0.4.0" }
krabka-units = { workspace = true }
object_store = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
