[package]
name = "krabka-profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Krabka profiles ingest service (distributor + block-builder) - Grafana-Pyroscope replacement"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-profiles"
readme = "README.md"
keywords = ["observability", "profiling", "pyroscope", "pprof", "krabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[features]
default = ["vendored-protoc"]
vendored-protoc = ["dep:protoc-bin-vendored"]
heap-profiling = ["krabka-telemetry/heap-profiling", "dep:tikv-jemallocator"]

[dependencies]
arrow = { workspace = true }
datafusion = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }
prost = { workspace = true }
num-traits = { workspace = true }
pbjson = { workspace = true }
prometheus-client = { workspace = true }
connectrpc-axum = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
derive_more = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-util = { workspace = true }
tower = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
jfrs = { workspace = true }
multer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde-wincode = { workspace = true }
wincode = { workspace = true }
clap = { workspace = true, features = ["env"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url = { workspace = true }
krabka-blockstore = { path = "../blockstore", version = "0.4.0" }
krabka-pprof = { path = "../pprof", version = "0.4.0" }
krabka-telemetry = { version = "0.4.0" }
krabka-client-producer = { version = "0.4.0" }
krabka-client-consumer = { version = "0.4.0" }
krabka-client-admin = { version = "0.4.0" }
krabka-client-core = { version = "0.4.0" }
krabka-throttle = { version = "0.4.0" }
krabka-units = { workspace = true }
refined_type = { workspace = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[build-dependencies]
connectrpc-axum-build = { workspace = true }
protoc-bin-vendored = { workspace = true, optional = true }

[dev-dependencies]
assert2 = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
temp-env = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest = { workspace = true, features = ["json"] }
testcontainers = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
krabka-pprof = { path = "../pprof", version = "0.4.0" }
