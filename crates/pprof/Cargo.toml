[package]
name = "krabka-pprof"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Language-less continuous-profiling engine (Grafana-Pyroscope-equivalent) for Krabka"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-pprof"
readme = "README.md"
keywords = ["observability", "pyroscope", "profiling", "flamegraph", "krabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
addr2line = { workspace = true }
arrow = { workspace = true }
async-trait = { workspace = true }
krabka-blockstore = { path = "../blockstore", version = "0.4.0" }
krabka-units = { workspace = true }
datafusion = { workspace = true }
object = { workspace = true }
prost = { workspace = true }
regex = { workspace = true }
refined_type = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde-wincode = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
wincode = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
protox = { workspace = true }

[dev-dependencies]
assert2 = { workspace = true }
mutants = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
