[package]
name = "krabka-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
# Depends on the git-pinned `datafusion` (no crates.io release), so this crate
# cannot be published to crates.io; matches krabka-blockstore / krabka-profiles.
publish = false
description = "Role-selectable observability service for Krabka's Loki-compatible logs path"
repository = "https://github.com/krabka-io/krabka-o11y"
homepage = "https://github.com/krabka-io/krabka-o11y"
documentation = "https://docs.rs/krabka-observability"
readme = "../../README.md"
keywords = ["observability", "loki", "logs", "krabka"]
categories = ["command-line-utilities"]

[features]
heap-profiling = ["krabka-telemetry/heap-profiling", "dep:tikv-jemallocator"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["http2", "json", "query", "ws"] }
base64 = { workspace = true }
clap = { workspace = true, features = ["env"] }
# The audit log, its hash chain, OCSF records and its disk spool. The broker
# writes its own audit trail with the same crate.
krabka-audit = { version = "0.4.0" }
krabka-blockstore = { version = "0.4.0", path = "../blockstore" }
krabka-client-admin = { version = "0.4.0" }
krabka-client-core = { version = "0.4.0" }
krabka-client-consumer = { version = "0.4.0" }
krabka-client-producer = { version = "0.4.0" }
krabka-ids = { version = "0.4.0" }
# `/log_level` reloads this process's filter, which means this crate -- not
# the pinned `krabka-telemetry`, whose `init` returns no reload handle --
# installs the stdout subscriber. `krabka-logfmt` is the formatter that
# `krabka-telemetry` would have installed, so the JSON lines are unchanged.
krabka-logfmt = { version = "0.4.0" }
krabka-logql = { version = "0.4.0", path = "../logql" }
# `ListenerProtocol` and `SaslMechanism`, the two types a `ClientSecurity` names
# that `krabka-client-core` does not re-export.
krabka-security = { version = "0.4.0" }
krabka-telemetry = { version = "0.4.0" }
krabka-units = { workspace = true }
datafusion.workspace = true
flate2 = { workspace = true }
futures-util = { workspace = true }
object_store.workspace = true
num-traits = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "logs"] }
parquet.workspace = true
prometheus-client.workspace = true
prost.workspace = true
# The audit writer's checkpoint and replay cadence runs on this sleeper, so a
# test can drive it without wall-clock time.
qubit-clock = { version = "0.8", features = ["tokio"] }
regex.workspace = true
# The outbound client that carries service-to-service credentials. The
# `loki_differential` suite also uses it, for both sides of its comparison.
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = { workspace = true }
subtle = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
snap.workspace = true
thiserror = { workspace = true }
time = { version = "0.3", default-features = false, features = ["parsing"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { workspace = true }
tokio-rustls = { workspace = true }
tower = { workspace = true }
tonic.workspace = true
url = "2"
x509-parser = { workspace = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
assert2 = { workspace = true }
flate2 = { workspace = true }
# `ingest_roundtrip` boots a real Krabka broker in-process and drives
# push -> WAL -> compactor -> query through it, the way krabka-metrics and
# krabka-traces already do. Test-only, hence dev-dependencies.
krabka-broker = { version = "0.4.0" }
mutants = { workspace = true }
# OTel stack for the `set_remote_parent_from_wal_records` re-parenting test --
# mirrors the export-less tracer subscriber `krabka-traces` uses for the same
# check. Test-only, hence dev-dependencies.
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace"] }
# `logql_engine_proptest` generates series, lines, selectors and line-filter
# chains, and checks the engine's answer against the one the LogQL
# specification gives. Test-only, hence dev-dependencies. It also uses
# `regex::escape`, which reaches it as a normal dependency of this crate.
proptest = { workspace = true }
rcgen = { workspace = true }
temp-env = "0.3"
tempfile.workspace = true
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true }
tracing-opentelemetry = { workspace = true }

# The scale suite. `test = false` keeps `cargo test` and `cargo test
# --workspace` from building this binary at all, which is what stops the
# `cargo` job on every pull request paying for a suite it would then skip on
# the `#[ignore]`. It stays reachable by name:
#
#     cargo test -p krabka-observability --test scale_object_store -- --ignored
#
# Under Bazel the same separation is the `scale` tag in BUILD.bazel, which
# //.bazelrc excludes from `bazel test //...` and selects with `--config=scale`.
[[test]]
name = "scale_object_store"
test = false

[[test]]
name = "soak_ingest_query"
test = false

[lints]
workspace = true
