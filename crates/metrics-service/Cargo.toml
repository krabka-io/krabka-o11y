[package]
name = "krabka-metrics-service"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Role-selectable metrics service wiring for Krabka's Prometheus/Mimir-compatible backend"
repository = "https://github.com/krabka-io/krabka-o11y"
homepage = "https://github.com/krabka-io/krabka-o11y"
documentation = "https://docs.rs/krabka-metrics-service"
keywords = ["observability", "prometheus", "mimir", "metrics", "krabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[features]
heap-profiling = ["krabka-telemetry/heap-profiling", "dep:tikv-jemallocator"]

[dependencies]
assert2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["json"] }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
krabka-blockstore = { path = "../blockstore", version = "0.4.0" }
krabka-ids = { version = "0.4.0" }
krabka-client-consumer = { version = "0.4.0" }
krabka-client-core = { version = "0.4.0" }
krabka-client-producer = { version = "0.4.0" }
krabka-metrics = { path = "../metrics", version = "0.4.0" }
krabka-observability = { path = "../observability", version = "0.4.0" }
krabka-promql = { path = "../promql", version = "0.4.0" }
krabka-telemetry = { version = "0.4.0" }
krabka-units = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
refined_type = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3", default-features = false, features = ["formatting"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
prost = { workspace = true }
snap = { workspace = true }
temp-env = "0.3"
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
