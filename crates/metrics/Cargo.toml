[package]
name = "krabka-metrics"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Prometheus/Grafana-Mimir-equivalent metrics backend for Krabka (data layer)"
repository = "https://github.com/robot-head/crabka"
homepage = "https://github.com/robot-head/crabka"
documentation = "https://docs.rs/krabka-metrics"
readme = "README.md"
keywords = ["observability", "prometheus", "mimir", "metrics", "krabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[features]
default = ["vendored-protoc"]
vendored-protoc = ["dep:protoc-bin-vendored"]
heap-profiling = ["krabka-telemetry/heap-profiling", "dep:tikv-jemallocator"]

[dependencies]
num-traits = { workspace = true }
async-trait = { workspace = true }
arrow = { workspace = true }
axum = { workspace = true, features = ["json"] }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
krabka-blockstore = { path = "../blockstore", version = "0.4.0" }
krabka-client-consumer = { version = "0.4.0" }
krabka-client-core = { version = "0.4.0" }
krabka-client-producer = { version = "0.4.0" }
krabka-ids = { version = "0.4.0" }
krabka-observability = { path = "../observability", version = "0.4.0" }
krabka-telemetry = { version = "0.4.0" }
krabka-throttle = { version = "0.4.0" }
krabka-units = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
opentelemetry-proto = { workspace = true }
prometheus-client = { workspace = true }
prost = { workspace = true }
refined_type = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wincode = { workspace = true }
serde_yaml = { workspace = true }
snap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url = { workspace = true }
wincode = { workspace = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[build-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true, optional = true }

[dev-dependencies]
assert2 = { workspace = true }
krabka-broker = { version = "0.4.0" }
krabka-client-admin = { version = "0.4.0" }
mutants = { workspace = true }
proptest = { workspace = true }
reqwest = { workspace = true }
temp-env = "0.3"
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
