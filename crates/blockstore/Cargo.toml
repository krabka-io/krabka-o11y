[package]
name = "krabka-blockstore"
# Not published: depends on a git pin of datafusion, which crates.io disallows.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Signal-agnostic columnar block store (Parquet on object storage + label/series index + DataFusion query) for Krabka observability"
repository = "https://github.com/krabka-io/krabka-o11y"
homepage = "https://github.com/krabka-io/krabka-o11y"
documentation = "https://krabka-io.github.io/krabka-o11y/krabka_blockstore/"
readme = "README.md"
keywords = ["observability", "datafusion", "parquet", "object-store", "krabka"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
assert2 = { workspace = true }
arrow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
parquet = { workspace = true }
datafusion = { workspace = true }
derive_more = { workspace = true }
hex = { workspace = true }
krabka-object-store = { version = "0.4.0" }
krabka-o11y-verified = { path = "../verified", version = "0.4.0" }
krabka-units = { workspace = true }
object_store = { workspace = true }
prometheus-client = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
refined_type = { workspace = true }
num-traits = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
object_store = { workspace = true, features = ["integration"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[test]]
name = "object_store_provider_contract"
test = false
