# cargo-mutants configuration — https://mutants.rs
#
# Read by a local `cargo mutants` run, and by the `cargo_mutants_test` targets
# via `--@rules_rs_mutants//mutants:config` in //.bazelrc. Both paths see the
# same file, and the paths written here are the workspace paths the results
# print.

test_tool = "nextest"

# promql puts fifteen of its tests behind `experimental-functions`, which is not
# a default feature, so a default-feature sweep compiles them out and every
# mutant in the code they cover reports as a survivor with nothing wrong --
# twenty-two in `double_exponential_smoothing` alone read that way.
#
# Sweep that crate with the feature on:
#
#     cargo mutants -p krabka-promql --features experimental-functions ...
#
# It is deliberately not set here. This file is shared with every other crate
# and with the Bazel targets, and `--all-features` would also switch on
# `vendored-protoc` -- which //bazel:defs.bzl explicitly filters out -- and
# `heap-profiling`, neither of which any test needs.
profile = "mutants"

# A surviving mutant in the ingest and query paths is often only caught by the
# slower in-process suites under each crate's tests/ dir. Give every mutant a
# generous timeout relative to the unmutated baseline so a legitimately-slower
# run is not misreported as a timeout survivor.
timeout_multiplier = 5.0
minimum_test_timeout = 120

exclude_globs = [
    # The three service entrypoints: parse CLI args, build a config, hand it to
    # the server, wait for a signal. No unit-testable decision in any of them,
    # and each is covered end to end by its crate's integration suite.
    "crates/metrics/src/bin/**",
    "crates/profiles/src/bin/**",
    "crates/traces/src/bin/**",
]

exclude_re = [
    # NOTE ON WRITING THESE: the name a pattern matches carries the return type
    # between the function and `with` --
    #
    #   replace new_str_list -> ListBuilder<StringBuilder> with ...
    #
    # while the failure output prints a shortened form without it, so a pattern
    # copied from that output never matches. `cargo-mutants --list` prints the
    # real names. Binary operators and match guards put the function at the end
    # instead: `replace < with <= in Type::method`.

    # `new_str_list` and `new_str_list_list` build an empty arrow builder.
    # `StringBuilder::default()` is `StringBuilder::new()`, `ListBuilder::from`
    # is `ListBuilder::new`, and the starting capacity is not observable in the
    # encoded batch -- so these replacements construct the same builder.
    "replace new_str_list -> .* with ListBuilder::(new|from)\\(Default::default\\(\\)\\)$",
    "replace new_str_list_list -> .* with ListBuilder::(new|from)\\(ListBuilder::(new|from)\\(Default::default\\(\\)\\)\\)$",
]
